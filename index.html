<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiger Parceiros</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --bg-sub:#FAFAF9; --bg-hover:#F4F4F3; --bg-active:#EFEFEE;
  --line:#EBEBEA; --line-strong:#DCDCDA;
  --text:#1B1B1A; --text-2:#5C5C58; --text-3:#8F8F8A;
  --accent:#F2682A; --accent-soft:#FEF0E9; --accent-text:#C24A12;
  --green:#1F7A3D; --green-bg:#E8F5EC; --amber:#8A5A00; --amber-bg:#FDF3DC;
  --red:#B42318; --red-bg:#FDECEA; --gray:#55595F; --gray-bg:#EFF0F1; --blue:#1D5FC4; --blue-bg:#E9F1FD;
  --bar-gross:#E4E4E1;
  --shadow:0 1px 2px rgba(20,20,18,.04), 0 8px 24px rgba(20,20,18,.08);
  --radius:10px;
}
:root[data-theme="dark"]{
  --bg:#141413; --bg-sub:#1A1A19; --bg-hover:#222220; --bg-active:#2A2A28;
  --line:#2A2A28; --line-strong:#383835;
  --text:#EDEDEA; --text-2:#A8A8A2; --text-3:#75756F;
  --accent-soft:#3A2116; --accent-text:#FF9B6B;
  --green:#6FD08F; --green-bg:#16301F; --amber:#F2C25B; --amber-bg:#352A12;
  --red:#FF8A80; --red-bg:#3A1A17; --gray:#B5B8BD; --gray-bg:#26282B; --blue:#8AB4FF; --blue-bg:#172641;
  --bar-gross:#34342F;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:13.5px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
button{font:inherit;color:inherit;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
svg{flex:none}
kbd{font:500 10.5px Inter;color:var(--text-3);border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--bg)}
.app{display:grid;grid-template-columns:240px 1fr;height:100vh}

.side{background:var(--bg-sub);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:10px 8px;overflow-y:auto}
.ws{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:8px;margin-bottom:10px}
.ws .logo{width:24px;height:24px;border-radius:6px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}
.ws b{font-weight:600}
.ws small{display:block;color:var(--text-3);font-size:11.5px;margin-top:-1px}
.side-search{display:flex;align-items:center;gap:8px;margin:0 2px 12px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text-3);cursor:pointer}
.side-search kbd{margin-left:auto}
.sec{font-size:11.5px;font-weight:500;color:var(--text-3);padding:12px 10px 4px}
.nav{display:flex;align-items:center;gap:9px;padding:5px 10px;border-radius:7px;color:var(--text-2);font-weight:500;border:0;background:none;width:100%;text-align:left}
.nav:hover{background:var(--bg-hover);color:var(--text)}
.nav.on{background:var(--bg-active);color:var(--text)}
.nav .ct{margin-left:auto;font-size:11.5px;color:var(--text-3);font-variant-numeric:tabular-nums}
.plogo{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;color:#fff;font-size:9.5px;font-weight:700;flex:none}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:8px}
.sync{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-3);padding:6px 10px}
.sync i{width:6px;height:6px;border-radius:50%;background:var(--green)}

.main{display:flex;flex-direction:column;min-width:0;height:100vh}
.top{display:flex;align-items:center;gap:10px;padding:0 24px;height:52px;border-bottom:1px solid var(--line);flex:none}
.crumb{display:flex;align-items:center;gap:6px;color:var(--text-3);font-weight:500}
.crumb b{color:var(--text);font-weight:600}
.crumb a{color:inherit;text-decoration:none;cursor:pointer}
.crumb a:hover{color:var(--text)}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:7px;border:1px solid var(--line-strong);background:var(--bg);font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--bg-hover)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.btn.pri:hover{filter:brightness(.96)}
.scroll{overflow:auto;flex:1}
.pad{padding:20px 24px 0}
.h1{font-size:20px;font-weight:650;letter-spacing:-.01em;margin:0 0 2px;display:flex;align-items:center;gap:10px}
.sub{color:var(--text-3);margin:0 0 16px}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi{border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px 10px;background:var(--bg)}
.kpi .l{font-size:12px;color:var(--text-3);font-weight:500}
.kpi .v{font-size:22px;font-weight:650;letter-spacing:-.02em;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;color:var(--text-3);display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:20px}
.kpi .d2{font-size:12px;color:var(--text-2);margin-top:2px}
.up{color:var(--green)} .down{color:var(--red)}

.views{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 24px;position:sticky;top:0;background:var(--bg);z-index:3}
.view{border:0;background:none;padding:9px 10px 10px;color:var(--text-2);font-weight:500;display:flex;gap:6px;align-items:center}
.view:hover{color:var(--text)}
.view.on{color:var(--text);box-shadow:inset 0 -2px 0 var(--text)}
.view .ct{font-size:11.5px;color:var(--text-3);background:var(--bg-hover);border-radius:5px;padding:0 5px}

.card{border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin:0 24px 16px;background:var(--bg)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.card-h b{font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-3)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--bg);padding:4px 10px;font-size:12px;font-weight:500;color:var(--text-2)}
.seg button.on{background:var(--bg-active);color:var(--text)}

table{width:100%;border-collapse:separate;border-spacing:0}
thead th{position:sticky;top:41px;background:var(--bg);z-index:2;text-align:left;font-weight:500;font-size:12px;color:var(--text-3);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th.r,td.r{text-align:right}
td{padding:0 12px;height:52px;border-bottom:1px solid var(--line);white-space:nowrap}
td:first-child,th:first-child{padding-left:24px}
td:last-child,th:last-child{padding-right:24px}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--bg-hover)}
.who{display:flex;align-items:center;gap:10px}
.who .plogo{width:26px;height:26px;border-radius:7px;font-size:11px}
.who b{font-weight:550;display:block}
.who small{color:var(--text-3);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:500}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.ok{background:var(--green-bg);color:var(--green)}
.warn{background:var(--amber-bg);color:var(--amber)}
.bad{background:var(--red-bg);color:var(--red)}
.neu{background:var(--gray-bg);color:var(--gray)}
.tag{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:12px;color:var(--text-2);background:var(--bg)}
.muted{color:var(--text-3)}
.money b{font-weight:550;display:block}
.money small{font-size:11.5px;display:block}
.share{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.share .bar{width:70px;height:6px;border-radius:3px;background:var(--bg-active);overflow:hidden}
.share .bar i{display:block;height:100%;background:var(--accent)}
tfoot td{font-weight:600;border-bottom:0;background:var(--bg-sub)}

.empty{padding:40px 24px;text-align:center;color:var(--text-3)}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}

.tl{position:relative;padding-left:22px;margin:4px 0}
.tl:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:1px;background:var(--line-strong)}
.ev{position:relative;margin-bottom:14px}
.ev:before{content:"";position:absolute;left:-19px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--bg);border:2px solid var(--accent)}
.ev .h{display:flex;gap:6px;align-items:center;font-size:12.5px;flex-wrap:wrap}
.ev .h b{font-weight:600}
.ev .h span{color:var(--text-3)}
.ev p{margin:5px 0 0;color:var(--text-2);background:var(--bg-sub);border:1px solid var(--line);border-radius:8px;padding:8px 10px}

.formula{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--text-2)}
.formula .t{border:1px solid var(--line);border-radius:6px;padding:2px 8px;background:var(--bg-sub)}
.formula .t b{color:var(--text);font-weight:600}

/* modal de import */
.scrim{position:fixed;inset:0;background:rgba(20,20,18,.24);opacity:0;pointer-events:none;transition:opacity .15s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.modal{position:fixed;left:50%;top:12vh;transform:translateX(-50%) translateY(-6px);width:520px;max-width:calc(100vw - 32px);background:var(--bg);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.15s;z-index:21}
.modal.on{opacity:1;pointer-events:auto;transform:translateX(-50%)}
.modal .mh{padding:16px 18px 6px;display:flex;align-items:center;gap:10px}
.modal .mh b{font-size:16px;font-weight:650}
.modal .mb{padding:6px 18px 18px}
.drop{border:1.5px dashed var(--line-strong);border-radius:12px;padding:26px;text-align:center;color:var(--text-3);margin:10px 0 12px}
.drop b{display:block;color:var(--text);font-weight:600;margin:6px 0 2px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer}
.opt:hover{background:var(--bg-hover)}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt small{display:block;color:var(--text-3)}
.preview{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:10px}
.preview table td{height:38px}
.preview table td:first-child{padding-left:12px}
.preview table td:last-child{padding-right:12px}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}

.cmdk{position:fixed;left:50%;top:14vh;transform:translateX(-50%);width:520px;max-width:calc(100vw - 32px);background:var(--bg);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.14s;z-index:30}
.cmdk.on{opacity:1;pointer-events:auto}
.cmdk input{width:100%;border:0;outline:0;background:none;color:var(--text);font:inherit;font-size:15px;padding:14px 16px;border-bottom:1px solid var(--line)}
.cmdk .grp{font-size:11.5px;color:var(--text-3);padding:10px 16px 4px;font-weight:500}
.cmdk .it{display:flex;gap:10px;align-items:center;padding:8px 10px;margin:0 6px;border-radius:8px;cursor:pointer}
.cmdk .it:hover,.cmdk .it.hl{background:var(--bg-hover)}
.cmdk .it span:last-child{margin-left:auto;color:var(--text-3);font-size:12px}
.cmdk .end{height:8px}
.tip{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:9px;font-size:12.5px;font-weight:500;box-shadow:var(--shadow);opacity:0;transition:.2s;pointer-events:none;z-index:40}
.tip.on{opacity:1}
.banner{margin:0 24px 14px;padding:10px 14px;border-radius:10px;background:var(--amber-bg);color:var(--amber);font-size:12.5px;display:flex;gap:8px;align-items:center}
.banner b{color:inherit}
@media (max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.kpis{grid-template-columns:repeat(2,1fr)}.kpis.k3{grid-template-columns:1fr}.hide-sm{display:none}}

.alert-err{margin:4px 0 12px;padding:10px 12px;border-radius:10px;background:var(--red-bg);color:var(--red);font-size:12.5px}
.alert-warn{margin:10px 0;padding:10px 12px;border-radius:10px;background:var(--amber-bg);color:var(--amber);font-size:12.5px}
.drop{display:block;cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.opt{cursor:default;display:block}
.opt:hover{background:transparent}
.muted-opt{opacity:.6}
.det{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.preview thead th{position:static;top:auto;padding:8px 12px}
.icon-x{width:30px;height:30px;display:grid;place-items:center;border:0;border-radius:7px;background:none;color:var(--text-3);cursor:pointer}
.icon-x:hover{background:var(--bg-hover);color:var(--text)}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:9px;font-size:12.5px;font-weight:500;box-shadow:var(--shadow);opacity:0;transition:.2s;pointer-events:none;z-index:40}
.toast.show{opacity:1}
.sync{cursor:default}

.vd-wrap{overflow-x:auto}
table.vd thead th{position:static}
table.vd th:first-child, table.vd td:first-child{position:sticky;left:0;background:var(--bg);z-index:1;min-width:150px}
table.vd td{height:auto;padding-top:8px;padding-bottom:8px}
.vd-c{white-space:nowrap;line-height:1.25}
.vd-n{display:block;font-weight:600;font-variant-numeric:tabular-nums}
.vd-g{display:block;font-size:12px;color:var(--text-2);font-variant-numeric:tabular-nums}
.vd-r{display:block;font-size:11.5px;color:var(--red);font-variant-numeric:tabular-nums}
.vd-tot{background:var(--bg-sub)}
.vd-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:18px 24px 0}
table.mini th{position:static;padding:7px 8px}
table.mini td{height:38px;padding:0 8px}
table.mini td:first-child, table.mini th:first-child{padding-left:0}
table.mini td:last-child, table.mini th:last-child{padding-right:0}
.views .view .plogo{width:16px;height:16px;font-size:8.5px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.mgrid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--text-3);font-weight:500}
.mgrid input,.mgrid select{height:34px;border:1px solid var(--line-strong);border-radius:8px;padding:0 10px;font:inherit;font-size:13px;background:var(--bg);color:var(--text)}
.mgrid input:focus,.mgrid select:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
@media (max-width:900px){.vd-grid{grid-template-columns:1fr}.mgrid{grid-template-columns:1fr}}
.custo-in{width:110px;height:30px;border:1px solid var(--line-strong);border-radius:7px;padding:0 8px;font:inherit;font-size:13px;text-align:right;background:var(--bg);color:var(--text)}
.custo-in:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.dre td{height:34px}
.dre td:first-child{color:var(--text-2)}
.dre tr.dre-sub td{font-weight:600;color:var(--text);border-top:1px solid var(--line-strong)}
.dre tr.dre-final td{font-weight:700;color:var(--text);background:var(--bg-sub);border-top:1px solid var(--line-strong)}
.dre tr.dre-final td.down, .dre tr.dre-sub td.down{color:var(--red)}
.setores td{height:auto;padding-top:10px;padding-bottom:10px;vertical-align:top}
.st-nome{font-weight:600}
.st-desc{font-size:12px;color:var(--text-3);white-space:normal;max-width:420px;line-height:1.35;margin-top:2px}
.st-bar{height:4px;border-radius:2px;background:var(--bg-active);margin-top:6px;max-width:240px;overflow:hidden}
.st-bar i{display:block;height:100%;background:#2E86AB}
table.vg tr.vg-tot td{font-weight:700;background:var(--bg-sub);border-top:1px solid var(--line-strong)}
.ro-card{overflow:hidden}
.ro-nota{font-size:12px;margin:8px 0 0;line-height:1.5}
.ro-card table.mini td, .ro-card table.mini th{white-space:nowrap}
.ro-card tr.ro-grupo td{background:var(--bg-sub);font-weight:600;padding-top:8px;padding-bottom:8px}
.ro-nicho{display:inline-block;font-size:11px;color:var(--text-3);border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-left:4px;font-weight:400}
.ro-th{text-align:center !important;border-bottom:1px solid var(--line)}
.ro-sel{height:28px;border:1px solid var(--line-strong);border-radius:7px;background:var(--bg);color:var(--text);font:inherit;font-size:12.5px;padding:0 6px}
.ro-chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.ro-chip{border:1px solid var(--line-strong);background:var(--bg);color:var(--text-2);border-radius:999px;padding:3px 10px;font-size:12px}
.ro-chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.banner.ro-aviso{align-items:flex-start}
.banner.ro-aviso ul{margin:4px 0 0;padding-left:18px}
.banner.ro-ok{background:var(--green-bg);color:var(--green)}
.crm-cola{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--text-3);font-weight:500;margin-bottom:10px}
.crm-cola textarea{border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;font:inherit;font-size:12.5px;background:var(--bg);color:var(--text);resize:vertical}
.pill.warn{background:var(--amber-bg);color:var(--amber)}
.crm-lido{margin:0 0 10px;padding:8px 10px;border-radius:8px;background:var(--bg-sub);font-size:12.5px;line-height:1.5}
.ld-tab select, .ld-tab input{height:30px;border:1px solid var(--line-strong);border-radius:7px;background:var(--bg);color:var(--text);font:inherit;font-size:12.5px;padding:0 6px}

/* ---------- Painel: só duas cores (tinta + azul), variações por intensidade ---------- */
.pn{--pn-ink:#0F172A;--pn-ink-rgb:15,23,42;--pn-acc:#1D4ED8;--pn-acc-rgb:29,78,216;--pn-bg:#FFFFFF;color:var(--pn-ink);background:var(--pn-bg);padding:20px 24px 40px;min-height:100%}
/* o Painel fica sempre com fundo branco, mesmo no modo escuro */
.pn *{border-color:rgba(var(--pn-ink-rgb),.12)}
.pn-muted{color:rgba(var(--pn-ink-rgb),.55)}
.pn-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.pn-head h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
.pn-head p{margin:2px 0 0;color:rgba(var(--pn-ink-rgb),.6);font-size:13px}
.pn-seg{display:inline-flex;border:1px solid rgba(var(--pn-ink-rgb),.2);border-radius:8px;overflow:hidden}
.pn-seg button{border:0;background:transparent;color:rgba(var(--pn-ink-rgb),.7);padding:6px 12px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
.pn-seg button.on{background:var(--pn-ink);color:var(--pn-bg)}
.pn-falta{font-size:12.5px;padding:8px 12px;border:1px dashed rgba(var(--pn-ink-rgb),.35);border-radius:8px;margin:0 0 12px;color:rgba(var(--pn-ink-rgb),.8)}
.pn-falta b{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--pn-ink);color:var(--pn-bg);font-size:11px;margin-right:6px}
.pn-falta a{color:var(--pn-acc);cursor:pointer;text-decoration:underline;font-weight:600}
.pn-tabs{display:flex;gap:4px;border-bottom:1px solid rgba(var(--pn-ink-rgb),.15);margin:0 0 16px;overflow-x:auto}
.pn-tabs button{border:0;background:none;color:rgba(var(--pn-ink-rgb),.6);font:inherit;font-weight:600;font-size:13.5px;padding:10px 12px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}

<script>
const CANAL_DEFS = [
  {key:'helpgrid', label:'Helpgrid', match:n => n.includes('helpgrid'),
   nota:'Líquido aqui = nossa parte de verdade: 52% do Net Líquido (depois de COGS 10%, reembolso/chargeback, comissão e imposto). Os outros 48% ficam com a Helpgrid, não entram nesse número.'},
  {key:'welcome_salesbound', label:'Welcome · Sales Bound', match:n => n.replace(/\s+/g,'').includes('salesbound'),
   nota:'Líquido aqui = nossa parte de verdade: (Bruto − Reembolso − COGS 10%) × 55%. Os outros 45% ficam com a Sales Bound, não entram nesse número.'},
  {key:'welcome_isellforu', label:'Welcome · iSellForU', match:n => n.replace(/\s+/g,'').includes('isellfor')}, // na BuyGoods vem "Isellfor You"
  {key:'gestor5', label:'Email (Gestor 5)', match:n => n.includes('gestor') && n.includes('five')},
  {key:'nuyu', label:'NuYu', match:n => n.replace(/\s+/g,'').includes('nuyu')},
  {key:'gestor3', label:'SMS (Gestor 3)', match:n => n.includes('gestor') && n.includes('three')}
];
function canalDoNome_(nomeNorm){
  if(!nomeNorm) return null;
  const def = CANAL_DEFS.find(c => c.match(nomeNorm));
  return def ? def.key : null;
}
// ---------- Sincronização com Google Sheets (Apps Script) ----------
// Depois de implantar o Apps Script (ver /apps_script/Code.gs), cole a URL aqui.
// Enquanto ficar vazio, a ferramenta funciona só com localStorage (não sincroniza entre navegadores).
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzw8CGWnulEgsl9rIBBIqTY1aHgLEQ4I5vw9QKqM0Jc-kPzFEQwMLRru3X1OJm3iPJn/exec";
let syncStatus = APPS_SCRIPT_URL ? 'pendente' : 'desativado'; // desativado | pendente | ok | erro
async function apiGet(){
  if(!APPS_SCRIPT_URL) return null;
  try {
    const r = await fetch(APPS_SCRIPT_URL + '?action=list');
    const j = await r.json();
    syncStatus = j && j.ok ? 'ok' : 'erro';
    return j;
  } catch(e){
    console.warn('Sincronização (GET) falhou, usando cache local:', e);
    syncStatus = 'erro';
    return null;
  }
}
async function apiPost(action, data){
  if(!APPS_SCRIPT_URL) return null;
  try {
    // Content-Type text/plain evita o preflight CORS que o Apps Script não responde
    const r = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify({action, data})
    });
    const j = await r.json();
    if(!j || !j.ok) console.warn('Apps Script retornou erro:', j);
    return j;
  } catch(e){
    console.warn('Sincronização (POST) falhou — salvo só localmente por enquanto:', e);
    syncStatus = 'erro';
    return null;
  }
}
function loadLS(key, fallback){
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch(e){ return fallback; }
}
function saveLS(key, val){
  try { localStorage.setItem(key, JSON.stringify(val)); } catch(e){ console.warn('localStorage falhou', e); }
}
const LS_CANAIS = 'tiger_canais_interno_dia_v1'; // vendas/valores por dia das contas internas (Helpgrid, Welcome, Gestores) — normalmente excluídas do ranking de afiliados
const LS_CANAL_LIFETIME = 'tiger_canal_lifetime_v1'; // totais gerais (sem granularidade de dia) por canal, vindos do export Master Affiliates — mesmo padrão do LS_LIFETIME por afiliado
const LS_CANAL_MENSAL = 'tiger_canal_mensal_v1'; // totais por canal e por mês (quando o Master Affiliates vem separado mês a mês), pra completar a coluna "Por mês" mesmo sem dado diário
let canaisPorDia = loadLS(LS_CANAIS, {}); // { canalKey: { 'YYYY-MM-DD': {vendas,gross,refund,chargeback,shipping,taxes} } }
let canalLifetime = loadLS(LS_CANAL_LIFETIME, {}); // { canalKey: {orders,gross,net,refunds,taxes,periodo} } — sem data, vindo do Master Affiliates
let canalMensal = loadLS(LS_CANAL_MENSAL, {}); // { canalKey: { 'YYYY-MM': {orders,gross,net,refunds,taxes} } } — Master Affiliates separado por mês
function serverCanaisToLocal(obj){
  const out = {};
  Object.keys(obj).forEach(k => {
    try { out[k] = JSON.parse(obj[k].dados_json || '{}'); } catch(e){ out[k] = {}; }
  });
  return out;
}
function serverCanalLifetimeToLocal(obj){
  const out = {};
  Object.keys(obj).forEach(k => {
    const r = obj[k];
    out[k] = {
      orders: Number(r.orders)||0, gross: Number(r.gross)||0, net: Number(r.net)||0,
      refunds: Number(r.refunds)||0, taxes: Number(r.taxes)||0, periodo: r.periodo || ''
    };
  });
  return out;
}
function serverCanalMensalToLocal(obj){
  const out = {};
  Object.keys(obj).forEach(k => {
    const r = obj[k];
    if(!r.canal || !r.mes) return;
    const mesKey = String(r.mes).replace('_','-'); // volta "2026_07" -> "2026-07" (formato salvo com "_" pra não virar data no Sheets)
    if(!/^\d{4}-\d{2}$/.test(mesKey)) return; // ignora linha antiga/corrompida (ex: mes virou timestamp por autoconversão do Sheets)
    if(!out[r.canal]) out[r.canal] = {};
    out[r.canal][mesKey] = {
      orders: Number(r.orders)||0, gross: Number(r.gross)||0, net: Number(r.net)||0,
      refunds: Number(r.refunds)||0, taxes: Number(r.taxes)||0, custo: Number(r.custo)||0,
      leads: (r.leads === '' || r.leads === undefined || r.leads === null) ? null : Number(r.leads)
    };
  });
  return out;
}
function fmtMoney(v){ return v.toLocaleString('en-US', {style:'currency', currency:'USD', maximumFractionDigits:0}); }
function fmtDate_(s){ if(!s) return ''; const m = String(s).match(/^\d{4}-\d{2}-\d{2}/); return m ? m[0] : String(s); }
function escapeHtml(s){ if(s===null||s===undefined) return ''; return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function showToast(msg){
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 1800);
}
function netOf_(v){
  if(!v) return null;
  return (v.gross||0) - (v.refund||0) - (v.chargeback||0) - (v.shipping||0) - (v.taxes||0);
}
// Sales Bound (CRM próprio, sem chargeback/shipping/taxes nesse nível) usa uma fórmula diferente
// da genérica acima: COGS de 10% sobre o bruto, e só 55% do que sobra é nosso — mesma conta da
// planilha mensal "Financial Performance" (Net Líquido = (Bruto − Reembolso) − COGS 10%; Tiger = 55%)
const MODO_MENSAL_ = ['gestor5','gestor3','nuyu']; // canais sem dado diário confiável: painel só mensal, alimentado pelo Master Affiliates
// Email/SMS: líquido = bruto − 10% COGS − 7% BuyGoods. Outros custos (comissão, reembolso etc.)
// ficam de fora de propósito — ela subtrai à mão.
// Setores da Helpgrid — cada conta de afiliado deles na BuyGoods é um setor/operação diferente
const SETORES_HG_ = [
  {k:'calls', nome:'HelpGrid Calls', desc:'Recuperação de carrinho abandonado (ACR): ligam pra quem começou a compra e não finalizou.', en:'Abandoned Cart Recovery (ACR) Calls'},
  {k:'inbound', nome:'HelpGrid Inbound Calls', desc:'O cliente retorna a ligação pro número de ACR depois de receber um recado de voz deles.', en:'When customers call our ACR OB phone number back after we leave them a voice message'},
  {k:'ordertaking', nome:'HelpGrid Order Taking', desc:'O cliente liga numa das linhas de venda pra fazer o pedido.', en:'When customers call one of our sales lines to place an order'},
  {k:'incredibles', nome:'HelpGrid Incredibles', desc:'Vendas por fatura (invoice) enviada por email e SMS.', en:'Invoices sales (email and text message)'},
  {k:'champions', nome:'HelpGrid Champions', desc:'Pedidos que entram quando o cliente liga no número de atendimento (CS).', en:'Inbound Order Taking revenue from customer calls to the CS number'},
  {k:'welcomeultimate', nome:'Helpgrid Welcome Ultimate', desc:'Descrição a definir com a Helpgrid.', en:''},
  {k:'interno', nome:'CRM interno da Help', desc:'Vendas da conta BuyGoods interna da Help (relatório Master Accounts) — vem por produto, sem separar setor.', en:''}
];
function setorHelpgrid_(nome){
  const n = String(nome || '').toLowerCase().replace(/\s+/g, ' ');
  if(n.includes('champions')) return 'champions';
  if(n.includes('incredibles')) return 'incredibles';
  if(n.includes('order taking')) return 'ordertaking';
  if(n.includes('inbound')) return 'inbound';
  if(n.includes('welcome ultimate')) return 'welcomeultimate';
  if(n.includes('welcome')) return null; // Welcome Calls não é da Helpgrid
  if(n.includes('calls')) return 'calls';
  return null;
}
function descConta_(canal, conta){
  if(canal !== 'helpgrid') return '';
  const st = SETORES_HG_.find(x => x.k === setorHelpgrid_(conta));
  return st ? st.desc : '';
}
function setoresCard_(){
  const mesesSet = new Set();
  SETORES_HG_.forEach(st => Object.keys(canalMensal['hgset_' + st.k] || {}).forEach(m => mesesSet.add(m)));
  const meses = Array.from(mesesSet).sort();
  if(!meses.length) return `<div class="card"><div class="empty"><b>Ainda sem dado por setor</b>Suba os Master Affiliates do mês da Helpgrid (os dois arquivos juntos) pra separar por setor.</div></div>`;
  if(!meses.includes(hgMes)) hgMes = meses[meses.length-1];
  const linhas = SETORES_HG_.map(st => {
    const v = (canalMensal['hgset_' + st.k] || {})[hgMes] || {orders:0, gross:0, net:0, refunds:0, taxes:0};
    return Object.assign({st, nosso: 0.52 * ((v.net||0) - 0.10*(v.gross||0))}, v);
  }).sort((a,b) => b.gross - a.gross);
  const tot = linhas.reduce((a,l) => ({orders:a.orders+l.orders, gross:a.gross+l.gross, refunds:a.refunds+l.refunds, net:a.net+l.net, nosso:a.nosso+l.nosso}), {orders:0, gross:0, refunds:0, net:0, nosso:0});
  const max = Math.max(1, ...linhas.map(l => l.gross));
  return `<div class="card"><div class="card-h"><b>Vendas por setor · ${mesLblCurto_(hgMes)}</b>
      <div class="seg">${meses.slice(-6).map(m => `<button class="${m===hgMes?'on':''}" data-hgmes="${m}">${mesLblCurto_(m)}</button>`).join('')}</div></div>
    <div style="overflow-x:auto"><table class="mini setores"><thead><tr><th>Setor</th><th class="r">Pedidos</th><th class="r">Bruto</th><th class="r hide-sm">Refund/CB</th><th class="r hide-sm">Net Sales</th><th class="r">Nosso (52%)</th></tr></thead><tbody>
    ${linhas.map(l => `<tr><td><div class="st-nome">${escapeHtml(l.st.nome)}</div><div class="st-desc">${escapeHtml(l.st.desc)}</div><div class="st-bar"><i style="width:${(l.gross/max*100).toFixed(1)}%"></i></div></td>
      <td class="r num">${l.orders || '<span class="muted">0</span>'}</td>
      <td class="r num"><b style="font-weight:600">${fmtMoney(l.gross)}</b><small class="muted" style="display:block">${tot.gross ? (l.gross/tot.gross*100).toFixed(0) : 0}% do total</small></td>
      <td class="r num hide-sm">${l.refunds ? '−' + fmtMoney(l.refunds) : '<span class="muted">—</span>'}${l.gross && l.refunds ? `<small class="muted" style="display:block">${(l.refunds/l.gross*100).toFixed(0)}% do bruto</small>` : ''}</td>
      <td class="r num hide-sm">${fmtMoney(l.net||0)}</td>
      <td class="r num"><b style="font-weight:600" class="${l.nosso < 0 ? 'down' : ''}">${fmtMoney(l.nosso)}</b></td></tr>`).join('')}
    </tbody><tfoot><tr><td>Total Helpgrid</td><td class="r num">${tot.orders}</td><td class="r num">${fmtMoney(tot.gross)}</td><td class="r num hide-sm">−${fmtMoney(tot.refunds)}</td><td class="r num hide-sm">${fmtMoney(tot.net)}</td><td class="r num">${fmtMoney(tot.nosso)}</td></tr></tfoot></table></div>
    <p class="muted" style="font-size:12px;margin:10px 0 0">Nosso = 52% × (Net Sales − COGS 10% do bruto). Net Sales do Master já desconta comissão, refund/chargeback e imposto.</p></div>`;
}
let hgMes = '';
const CUSTO_CANAIS_ = ['gestor3','gestor5']; // parceiros com custo do mês lançado à mão
const CUSTO_LABEL_ = {gestor3: 'Custo do disparo', gestor5: 'AWeber'};
const SAVA_FIXO_ = 6800, SAVA_VARIAVEL_ = 0.07;
// demonstrativo linha a linha — a mesma conta que o líquido usa
function dre_(key, v){
  const g = (v && v.gross) || 0, refunds = (v && v.refunds) || 0, custo = (v && v.custo) || 0;
  const L = [['Faturamento', g, 'gross']];
  L.push(['(−) COGS 10%', -g*0.10]); L.push(['(−) Taxa BG 7%', -g*0.07]);

// ---------- Resumo da semana (pra mandar na segunda) ----------
function resumoSemana_(){
  const hoje = hojeKey_();
  // semana fechada anterior (segunda a domingo)
  const segAtual = isoWeekMonday_(hoje);
  const ini = new Date(segAtual + 'T12:00:00'); ini.setDate(ini.getDate() - 7);
  const iniK = ini.toISOString().slice(0,10);
  const fim = new Date(ini); fim.setDate(fim.getDate() + 6); const fimK = fim.toISOString().slice(0,10);
  const dentro = d => d >= iniK && d <= fimK;
  const RESP = {helpgrid:'call recovery', gestor5:'Sava', gestor3:'Nicollas', welcome_salesbound:'call center', welcome_isellforu:'welcome', nuyu:'welcome'};
  let tot = {v:0,g:0,r:0};
  const blocos = PKEYS.map(k => {
    const fonte = diasFonte_(k); const s = {v:0,g:0,r:0};
    Object.keys(fonte).forEach(d => { if(dentro(d)){ s.v += fonte[d].vendas||0; s.g += fonte[d].gross||0; s.r += (fonte[d].refund||0)+(fonte[d].chargeback||0); } });
    if(!s.v && !s.g && !s.r) return null;
    tot.v += s.v; tot.g += s.g; tot.r += s.r;
    const contas = contasDo_(k, dentro).map(ct => { const a = {v:0,g:0}; Object.keys(parceirosDia[k]||{}).forEach(d => { if(dentro(d)){ const t = totDia_(k, d, ct); a.v += t.v; a.g += t.g; } }); return {ct, ...a}; }).filter(x => x.v || x.g).sort((a,b) => b.g - a.g);
    return `• ${PMETA[k].nome} (${RESP[k]}): ${s.v ? s.v + ' vendas · ' : ''}${fmtMoney(s.g)} bruto${s.r ? ' · −' + fmtMoney(s.r) + ' reembolso/CB' : ''}` +
      (contas.length > 1 ? '\n' + contas.map(c => `   – ${c.ct}: ${c.v} vendas · ${fmtMoney(c.g)}`).join('\n') : '');
  }).filter(Boolean);
  const prods = {};
  PKEYS.forEach(k => Object.keys(parceirosDia[k]||{}).forEach(d => { if(!dentro(d)) return; const c = parceirosDia[k][d].c || {}; Object.values(c).forEach(x => Object.keys(x.p||{}).forEach(p => { prods[p] = (prods[p]||0) + (x.p[p][1]||0); })); }));
  const top = Object.keys(prods).sort((a,b) => prods[b]-prods[a]).slice(0,5).map(p => `${p} ${fmtMoney(prods[p])}`).join(' · ');
  const faltam = []; for(let d = new Date(iniK+'T12:00:00'); d <= fim; d.setDate(d.getDate()+1)){ const dk = d.toISOString().slice(0,10); if(!diasRelatorio.includes(dk)) faltam.push(diaLbl_(dk)); }
  return `Resumo semanal parceiros — ${diaLbl_(iniK)} a ${diaLbl_(fimK)}\n` +
    `Total: ${tot.v} vendas · ${fmtMoney(tot.g)} bruto${tot.r ? ' · −' + fmtMoney(tot.r) + ' reembolso/CB' : ''}\n\n` +
    (blocos.length ? blocos.join('\n') : 'Sem vendas registradas na semana.') +
    (top ? `\n\nProdutos que mais venderam: ${top}` : '') +
    (faltam.length ? `\n\nObs: sem relatório BuyGoods em ${faltam.join(', ')}.` : '');
}
function copiarResumo_(){
  const t = resumoSemana_();
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => showToast('Resumo da semana copiado ✓')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); showToast('Resumo da semana copiado ✓');
  });
}

// ---------- Import de relatórios BuyGoods diários (vários arquivos de uma vez) ----------
function ehRelatorioBuyGoods_(wb){
  return wb.SheetNames.some(sn => {
    const h = (XLSX.utils.sheet_to_json(wb.Sheets[sn], {header:1, raw:true, defval:null})[0]) || [];
    return h.includes('Affiliate Name') && h.includes('Action Type') && h.includes('Gross') && h.includes('Create Date');
  });
}
function parseRelatorioBuyGoods_(wb, nome){
  let diaArquivo = (nome.match(/(\d{4}-\d{2}-\d{2})/) || [])[1] || null;
  const linhas = [];
  const vistos = new Set();
  wb.SheetNames.forEach(sn => {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], {header:1, raw:true, defval:null});
    if(!rows.length) return;
    const hidx = {}; (rows[0] || []).forEach((h,i) => hidx[h] = i);
    if(!('Affiliate Name' in hidx) || !('Action Type' in hidx) || !('Gross' in hidx) || !('Create Date' in hidx)) return;
    for(let i=1; i<rows.length; i++){
      const row = rows[i]; if(!row) continue;
      const canc = row[hidx['Was Canceled']]; if(canc == 1 || canc === true) continue;
      const tipo = row[hidx['Action Type']];
      const idItem = 'Order Item Id' in hidx ? row[hidx['Order Item Id']] : null;
      if(idItem){ const kId = idItem + '|' + tipo; if(vistos.has(kId)) continue; vistos.add(kId); }
      linhas.push({row, hidx, sn, tipo});
    }
  });
  if(!diaArquivo){
    const cont = {};
    linhas.forEach(l => { if(l.tipo !== 'neworder') return; const dt = new Date(l.row[l.hidx['Create Date']]); if(!isNaN(dt)) { const k = dt.toISOString().slice(0,10); cont[k] = (cont[k]||0) + 1; } });
    diaArquivo = Object.keys(cont).sort((a,b) => cont[b]-cont[a])[0] || null;
  }
  if(!diaArquivo) return {erro: `Não consegui descobrir o dia do relatório "${nome}".`};
  const out = {};
  linhas.forEach(({row, hidx, sn, tipo}) => {
    const nomeAf = row[hidx['Affiliate Name']]; if(!nomeAf) return;
    const canal = canalDoNome_(normName(nomeAf)); if(!canal) return;
    const conta = String(nomeAf).trim().replace(/\s+/g, ' ');
    if(!out[canal]) out[canal] = {};
    if(!out[canal][conta]) out[canal][conta] = {v:0, i:0, g:0, r:0, cb:0, p:{}};
    const x = out[canal][conta];
    if(tipo === 'neworder'){
      const g = parseFloat(row[hidx['Gross']]) || 0;
      x.i++; x.g += g;
      const prod = sn;
      if(!x.p[prod]) x.p[prod] = [0, 0];
      x.p[prod][1] += g;
      if(isFrontal_(row, hidx)){ x.v++; x.p[prod][0]++; }
    } else if(tipo === 'refund'){
      x.r += parseFloat(row[hidx['Refund Amount']]) || 0;
    } else if(tipo === 'chargeback'){
      x.cb += parseFloat(row[hidx['Chargeback Amount']]) || 0;
    }
  });
  Object.values(out).forEach(cs => Object.values(cs).forEach(x => { x.g = Math.round(x.g*100)/100; x.r = Math.round(x.r*100)/100; x.cb = Math.round(x.cb*100)/100; Object.values(x.p).forEach(p => p[1] = Math.round(p[1]*100)/100); }));
  return {dia: diaArquivo, canais: out, arquivo: nome};
}
function isFrontal_(row, hidx){
  if(!('Product Codename' in hidx)) return true;
  const code = String(row[hidx['Product Codename']] || '').trim().toLowerCase();
  if(!code) return true;
  if(/^shi/.test(code)) return false;
  if(/up\d/.test(code)) return false;
  if(/dw\d/.test(code)) return false;
  return true;
}
function montarPendenteBuyGoods_(relatorios){
  const porDia = {};
  relatorios.sort((a,b) => a.arquivo.localeCompare(b.arquivo)).forEach(r => { porDia[r.dia] = r; }); // mesmo dia 2x: fica o último
  const dias = Object.keys(porDia).sort();
  const linhas = [];
  dias.forEach(dia => {
    const cs = porDia[dia].canais;
    const canais = new Set(CANAIS_BUYGOODS_.concat(Object.keys(cs)));
    canais.forEach(k => {
      const novo = Object.values(cs[k] || {}).reduce((a,x) => ({v: a.v + x.v, g: a.g + x.g}), {v:0, g:0});
      const antes = (parceirosDia[k] || {})[dia] ? totDia_(k, dia) : null;
      linhas.push({k, dia, novo, antes});
    });
  });
  return {tipo: 'buygoods', tipoLbl: 'Relatório BuyGoods diário', arquivo: dias.length === 1 ? porDia[dias[0]].arquivo : `${relatorios.length} arquivos`, porDia, dias, linhasBG: linhas};
}
async function confirmarBuyGoods_(p){

function parceirosDiaDoServidor_(obj){

// texto pronto pra mandar (WhatsApp / e-mail) com o resumo do período
function textoResumoRO_(){
  const per = periodoRO_(roPeriodo), R = resumoOfertas_(per), cob = coberturaRO_(per);
  const L = [`Resumo parceiros — ${per.lbl} (${diaLbl_(per.ini)} a ${diaLbl_(per.fim)})`, ''];
  PKEYS.forEach(k => {
    const P = Object.assign({}, R[k], R[k].oficial ? {v: R[k].oficial.v, g: R[k].oficial.g} : {}); if(!(P.v || P.g || P.temLeads || R[k].oficial)) return;
    L.push(`• ${PMETA[k].nome}${R[k].oficial ? ' (fechamento)' : ''}: ${int_(P.v)} ${P.v === 1 ? 'venda' : 'vendas'} · ${fmtMoney(P.g)} bruto${P.temLeads ? ` · ${int_(P.l)} leads${P.leadsMensal ? ' (mês)' : ''}${P.leadsJanela ? ` (${P.leadsJanela})` : ''} · conversão ${conv_(P.leadsJanela ? P.vJan : P.v, P.l)}` : ' · leads não lançados'}${P.a ? ` · ${int_(P.a)} agendamentos` : ''}`);
    const top = Object.entries(P.ofertas).filter(([o, x]) => o !== SEM_OFERTA_ && (x.v || x.itens)).sort((a, b) => (b[1].v + b[1].itens) - (a[1].v + a[1].itens)).slice(0, 4);
    if(top.length) L.push('   ' + top.map(([o, x]) => `${o} ${x.v ? int_(x.v) : int_(x.itens) + ' pedidos c/'}`).join(' · '));
  });
  const A = roCmp.a, B = roCmp.b;
  if(roCmp.ofertas.length){
    L.push('', `Comparação ${PMETA[A].nome} × ${PMETA[B].nome}:`);
    roCmp.ofertas.forEach(o => {
      const f = k => { const x = R[k].ofertas[o] || {}; const n = k === 'welcome_salesbound' ? `${int_(x.itens)} ${x.itens === 1 ? 'pedido' : 'pedidos'} com a oferta` : `${int_(x.v)} ${x.v === 1 ? 'venda' : 'vendas'}`; const v = vConv_(k, x, R[k]); return `${n}${x.temLeads ? ` / ${int_(x.l)} leads${v !== null && x.l ? ` (${conv_(v, x.l)})` : ''}` : ''}`; };
      L.push(`• ${o}: ${PMETA[A].nome} ${f(A)} | ${PMETA[B].nome} ${f(B)}`);
    });
  }
  const falta = [];
  if(cob.semRelatorio.length) falta.push(`relatório BuyGoods ${faixaDias_(cob.semRelatorio)}`);
  if(cob.sbFalta.length) falta.push(`CRM Sales Bound ${faixaDias_(cob.sbFalta)}`);
  if(cob.sbSemQtd.length) falta.push(`quantidade de vendas da Sales Bound em ${faixaDias_(cob.sbSemQtd)}`);
  LEADS_PARCEIROS_.forEach(k => { if(cob.leadsFalta[k].length && !R[k].leadsMensal && !R[k].leadsJanela) falta.push(`leads ${PMETA[k].nome}`); });
  if(falta.length) L.push('', 'Pendente: ' + falta.join('; ') + '.');
  L.push('', per.mesInteiro ? 'Totais por parceiro = fechamento oficial do mês; ofertas pelos relatórios diários.' : 'Pelos relatórios diários (vendas = pedidos frontais; Helpgrid só conta geral). Sales Bound por oferta = pedidos em que a oferta aparece.');
  return L.join('\n');
}

async function salvarLeads_(){

  if(ate && ate < dia){ $('#ldErr').innerHTML = '<div class="alert-err">O "até" precisa ser depois do início.</div>'; return; }
  const reg = {};
  for(const x of ldLinhas){
    if(x.l === '' && x.a === '') continue;
    const l = parseInt(x.l, 10), a = parseInt(x.a, 10);
    if((x.l !== '' && (isNaN(l) || l < 0)) || (x.a !== '' && (isNaN(a) || a < 0))){ $('#ldErr').innerHTML = '<div class="alert-err">Leads e agendamentos precisam ser números inteiros (0 ou mais).</div>'; return; }
    if(reg[x.o]){ $('#ldErr').innerHTML = `<div class="alert-err">A oferta ${escapeHtml(x.o)} aparece duas vezes.</div>`; return; }
    reg[x.o] = {l: isNaN(l) ? 0 : l, a: isNaN(a) ? 0 : a};
  }
  if(!Object.keys(reg).length){ $('#ldErr').innerHTML = '<div class="alert-err">Preencha pelo menos uma linha (pode ser 0).</div>'; return; }
  if(ate && ate > dia) return salvarLeadsPeriodo_(k, dia, ate, reg);
  if(!leadsDia[dia]) leadsDia[dia] = {};
  leadsDia[dia][k] = reg;
  saveLS('tiger_leads_dia_v1', leadsDia);
  const tot = Object.values(reg).reduce((s, x) => ({l: s.l + x.l, a: s.a + x.a}), {l:0, a:0});
  const resumo = `Leads ${PMETA[k].nome} ${diaLbl_(dia)}: ${int_(tot.l)} leads${tot.a ? ` · ${int_(tot.a)} agendamentos` : ''}` + (Object.keys(reg).length > 1 || !reg[SEM_OFERTA_] ? ` (${Object.entries(reg).map(([o, x]) => `${o} ${x.l}`).join(', ')})` : '');
  const regLog = {id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), quando: new Date().toISOString(), arquivo: 'Leads', tipo: 'Leads', tipoLbl: 'Leads', parceiros: k, resumo};
  importLog.unshift(regLog); saveLS('tiger_import_log_v1', importLog);
  closeAll(); render(); showToast('Leads salvos' + (APPS_SCRIPT_URL ? ' — sincronizando...' : ''));

  const mk = dia.slice(0,7), dados = {}; Object.keys(leadsDia).forEach(d => { if(d.slice(0,7) === mk) dados[d] = leadsDia[d]; });
  const [r1] = await Promise.all([apiPost('importParceirosDiaBatch', [{id: '__leads__' + mk.replace('-','_'), canal: '__leads', mes: mk.replace('-','_'), dados_json: JSON.stringify(dados)}]),
    apiPost('logImport', {id: regLog.id, arquivo: regLog.arquivo, tipo: regLog.tipo, parceiros: regLog.parceiros, resumo})]);

  showToast(r1 && r1.ok ? 'Leads sincronizados com o Sheets ✓' : 'Leads salvos só neste navegador — não sincronizou');
}

// ---------- Funil da NuYu (painel KPI deles colado: leads → avaliações → agendamentos → comparecimentos → vendas) ----------
let funisNuyu = loadLS('tiger_funil_nuyu_v1', {}); // {'AAAA-MM-DD_AAAA-MM-DD': {ini, fim, leads, aval, agend, shows, vendas, valor, liquido, salvoEm}}
const MES3_ = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function lerPainelNuyu_(txt){
  const t = '\n' + String(txt || '').replace(/\r/g, '') + '\n';
  const dt = (mes, dia, ano) => { const n = MES3_[String(mes).slice(0,3).toLowerCase()]; return n ? `${ano}-${String(n).padStart(2,'0')}-${String(dia).padStart(2,'0')}` : null; };
  const m = t.match(/Showing data for\s+([A-Za-z]{3,9})\s+(\d{1,2}),\s*(\d{4})(?:\s*[-–]\s*([A-Za-z]{3,9})\s+(\d{1,2}),\s*(\d{4}))?/);
  if(!m) return {erro: 'Não achei o período ("Showing data for …"). Copie a página do KPI Dashboard da NuYu inteira.'};
  const ini = dt(m[1], m[2], m[3]), fim = m[4] ? dt(m[4], m[5], m[6]) : ini;
  if(!ini || !fim) return {erro: 'Não entendi as datas do período.'};
  // cada cartão do painel: título, uma linha de descrição e o número
  const cartao = rot => {
    const i = t.indexOf('\n' + rot + '\n'); if(i < 0) return null;
    const linhas = t.slice(i + rot.length + 2).split('\n').map(x => x.trim()).filter(Boolean).slice(0, 3);
    for(const l of linhas){ if(/^\$?-?[\d,]+(\.\d+)?$/.test(l)) return parseFloat(l.replace(/[$,]/g, '')); }
    return null;
  };
  const aval = (t.match(/(\d[\d,]*)\s+assessments/) || [])[1];
  const r = {ini, fim, leads: cartao('Total Leads'), agend: cartao('Bookings'), shows: cartao('Shows'), vendas: cartao('Sales'),
    aval: aval ? parseInt(aval.replace(/,/g, ''), 10) : null, valor: cartao('Total Sales Amount'), liquido: cartao('Net Revenue')};
  if(r.leads === null) return {erro: 'Não achei "Total Leads" no texto colado.'};
  return r;
}

        <td class="r num">${pct(f.agend, f.leads)}</td><td class="r num">${pct(f.shows, f.agend)}</td><td class="r num">${pct(f.vendas, f.shows)}</td><td class="r num"><b>${pct(f.vendas, f.leads)}</b></td><td class="r num">${f.valor !== null && f.valor !== undefined ? fmtMoney(f.valor) : '—'}</td></tr>`).join('')}

    : '<p class="muted">Nenhum painel da NuYu colado ainda.</p>'}</div>`;
}

// ---------- Relatório de pedidos do CRM da Sales Bound (Checkout Champ → Order Details, .xlsx) ----------
// Um pedido por linha, com até 10 produtos. Daqui sai, por dia: pedidos, bruto, e por oferta quantos pedidos
// tiveram a oferta e a receita dela. Nenhum dado de cliente (nome, e-mail, endereço, cartão) é guardado.
function ehPedidosCRM_(wb){
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:true, defval:null}).slice(0, 12);
  return rows.some(r => r && r.includes('orderStatus') && r.includes('product1 name') && r.includes('total'));
}
function parsePedidosCRM_(wb, nome){
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:true, defval:null});
  const hpos = rows.findIndex(r => r && r.includes('orderStatus') && r.includes('product1 name'));
  const hidx = {}; rows[hpos].forEach((h, i) => { hidx[h] = i; });

// mesma precedência que o painel antigo usava: dado diário vale, a não ser que o mensal oficial seja maior
function valorMes_(key, mk){
  const bf = (canalMensal[key] || {})[mk];
  if(MODO_MENSAL_.includes(key)) return bf ? {gross: bf.gross||0, net: liqMensal_(key, bf), orders: bf.orders||0} : null;
  if(key === 'helpgrid'){

    if(bf) return {gross: bf.gross||0, net: liqMensal_(key, bf), orders: bf.orders || dh.vendas};
    if(dh.vendas > 0 || dh.gross !== 0) return {gross: dh.gross, net: null, orders: dh.vendas};
    return null;
  }
  const d = somaCanalPeriodo_(key, x => x.slice(0,7) === mk);
  const temD = (d.vendas > 0 || d.gross !== 0) && !(bf && (bf.gross||0) >= d.gross) && !(bf && SPLIT_WELCOME_[key] && (bf.gross || 0) > 0);
  if(temD) return {gross: d.gross, net: netCanal_(key, d), orders: d.vendas};
  if(bf) return {gross: bf.gross||0, net: SPLIT_WELCOME_[key] ? liqMensal_(key, bf) : (bf.net||0), orders: bf.orders||0};
  return null;
}
// Welcome (iSellForU, NuYu): quantos leads foram passados no mês — lançado à mão, vem do parceiro

function leadsMes_(key, mk){ const bf = (canalMensal[key] || {})[mk]; return bf && bf.leads !== null && bf.leads !== undefined ? bf.leads : null; }
function fmtInt_(n){ return Number(n).toLocaleString('pt-BR'); }
function convTxt_(orders, leads){ return leads ? (orders / leads * 100).toLocaleString('pt-BR', {maximumFractionDigits: 2}) + '%' : '—'; }
function leadsKpi_(key, orders, leads){
  if(!LEADS_CANAIS_.includes(key) || leads === null) return '';

  if(!MODO_MENSAL_.includes(key)) canalAllDays_(key).forEach(d => s.add(d.slice(0,7)));
  return Array.from(s).filter(m => valorMes_(key, m)).sort();

function diasDesde_(iso){

function deltaHtml_(a, b){

function barChart_(series, keys, h){
  const W=720, H=h||210, pl=48, pb=24, pt=8, pr=8, cw=W-pl-pr, ch=H-pt-pb;
  const max = Math.max(1, ...series.flatMap(s => keys.map(k => s.vals[k]||0)));
  const gw = cw/Math.max(keys.length,1), bw = Math.min(22, (gw*0.72)/Math.max(series.length,1));
  let g = [0.25,0.5,0.75,1].map(f => { const y=pt+ch*(1-f); return `<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-dasharray="2,3"/><text x="${pl-6}" y="${y+3}" text-anchor="end" font-size="10" fill="var(--text-3)">${fmtK_(max*f)}</text>`; }).join('');
  keys.forEach((k,i) => {
    const gx = pl + i*gw + gw/2 - (bw*series.length)/2;
    series.forEach((s,j) => {
      const v = Math.max(0, s.vals[k]||0), bh = v/max*ch;
      g += `<rect x="${(gx+j*bw+1).toFixed(1)}" y="${(pt+ch-bh).toFixed(1)}" width="${Math.max(bw-2,1).toFixed(1)}" height="${bh.toFixed(1)}" rx="3" fill="${s.color}"><title>${escapeHtml(s.label)} · ${mesLblCurto_(k)}: ${fmtMoney(s.vals[k]||0)}</title></rect>`;
    });
    g += `<text x="${pl+i*gw+gw/2}" y="${H-7}" text-anchor="middle" font-size="11" fill="var(--text-3)">${mesLblCurto_(k)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;max-height:260px">${g}</svg>`;
}

function importsDe_(key){ return importLog.filter(i => (i.parceiros||'').split(',').includes(key)); }
function timelineImports_(lista){

function fmtQuando_(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('pt-BR', {day:'2-digit', month:'short'}) + ' · ' + d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
}

function custoCard_(key){
  const mk = mesAtual_();
  const meses = Array.from(new Set(mesesDo_(key).concat([mk]))).sort().slice(-3);
  const linhas = meses.map(m => dre_(key, (canalMensal[key]||{})[m] || {}));
  const fmtL = (val, tipo) => tipo === 'gross' ? fmtMoney(val) : val < 0 ? '−' + fmtMoney(Math.abs(val)) : fmtMoney(val);
  const corpo = linhas[0].map((row, r) => {
    const tipo = row[2] || '';
    const cls = tipo === 'final' ? 'dre-final' : tipo === 'sub' ? 'dre-sub' : '';
    return `<tr class="${cls}"><td>${row[0]}</td>${meses.map((m, c) => {
      const val = linhas[c][r][1];
      if(tipo === 'custo'){ const bf = (canalMensal[key]||{})[m] || {}; return `<td class="r"><input class="custo-in" type="number" min="0" step="0.01" data-custo-mes="${m}" value="${bf.custo ? bf.custo : ''}" placeholder="0,00"></td>`; }
      return `<td class="r num ${val < 0 && tipo !== 'final' && tipo !== 'sub' ? 'muted' : ''} ${(tipo === 'final' || tipo === 'sub') && val < 0 ? 'down' : ''}">${fmtL(val, tipo)}</td>`;
    }).join('')}</tr>`;
  }).join('');
  return `<div class="card"><div class="card-h"><b>Demonstrativo do mês</b><span class="muted" style="font-size:12px">${CUSTO_LABEL_[key]} é lançado à mão</span></div>

async function salvarCustos_(key){
  const batch = [], mudou = [];
  document.querySelectorAll('[data-custo-mes]').forEach(inp => {
    const m = inp.dataset.custoMes, novo = Math.round((parseFloat(inp.value) || 0) * 100) / 100;
    if(!canalMensal[key]) canalMensal[key] = {};
    const atual = canalMensal[key][m] || {orders:0, gross:0, net:0, refunds:0, taxes:0};
    if((atual.custo || 0) === novo) return;
    canalMensal[key][m] = Object.assign({}, atual, {custo: novo});
    batch.push({canal: key, mes: m.replace('-','_'), custo: novo});
    mudou.push(`${mesLblCurto_(m)}: ${fmtMoney(novo)}`);
  });
  if(!batch.length){ showToast('Nenhum custo mudou'); return; }
  saveLS(LS_CANAL_MENSAL, canalMensal);
  render();
  showToast(CUSTO_LABEL_[key] + ' salvo' + (APPS_SCRIPT_URL ? ' — sincronizando...' : ''));
  if(!APPS_SCRIPT_URL) return;
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  const reg = {id, quando: new Date().toISOString(), arquivo: CUSTO_LABEL_[key], tipo: 'Custo do mês', tipoLbl: 'Custo do mês', parceiros: key, resumo: `${PMETA[key].nome} — ${CUSTO_LABEL_[key]} ${mudou.join(' · ')}`};
  importLog.unshift(reg); saveLS('tiger_import_log_v1', importLog);
  const [r1] = await Promise.all([apiPost('importCanalMensalBatch', batch), apiPost('logImport', {id, arquivo: reg.arquivo, tipo: reg.tipo, parceiros: key, resumo: reg.resumo})]);
  if(r1 && r1.ok){ syncStatus = 'ok'; showToast('Sincronizado com Google Sheets ✓'); }
  else { syncStatus = 'erro'; showToast('Salvo neste navegador, mas não sincronizou com o Sheets ainda'); }
  renderSyncBadge();
}

function lerArquivos_(files){
  impPending = null;
  renderImport_(null, `Lendo ${files.length} ${files.length===1?'arquivo':'arquivos'}…`);
  Promise.all(files.map(f => new Promise(res => {
    const reader = new FileReader();
    reader.onload = e => { try { res({f, wb: XLSX.read(e.target.result, {type:'binary', cellDates:false})}); } catch(err){ res({f, erro: true}); } };
    reader.readAsBinaryString(f);
  }))).then(lidos => {
    const ruins = lidos.filter(x => x.erro);
    if(ruins.length){ renderImport_(`Não consegui ler: ${ruins.map(x => x.f.name).join(', ')}. Precisa ser .xls ou .xlsx.`); return; }
    if(lidos.length === 1 && ehPedidosCRM_(lidos[0].wb)){ const r = parsePedidosCRM_(lidos[0].wb, lidos[0].f.name); if(r.erro){ renderImport_(r.erro); return; } impPending = r; renderImport_(); return; }
    const bg = lidos.filter(x => ehRelatorioBuyGoods_(x.wb));
    if(bg.length && bg.length === lidos.length){
      const rel = bg.map(x => parseRelatorioBuyGoods_(x.wb, x.f.name));
      const erro = rel.find(r => r.erro); if(erro){ renderImport_(erro.erro); return; }
      impPending = montarPendenteBuyGoods_(rel); renderImport_(); return;
    }
    if(lidos.length > 1){
      const ms = lidos.map(x => detectarEParsear_(x.wb, x.f.name));
      if(ms.every(m => m.tipo === 'master')){ const r = somarMasters_(ms); if(r.erro){ renderImport_(r.erro); return; } impPending = r; renderImport_(); return; }
      renderImport_('Vários arquivos de uma vez funciona pra relatórios BuyGoods diários ou pra Master Affiliates do mesmo mês. O Financial Performance vai sozinho.'); return;
    }
    const r = detectarEParsear_(lidos[0].wb, lidos[0].f.name);
    if(r.erro){ renderImport_(r.erro); return; }
    if(r.interno) aplicarInternoHelpgrid_(r);
    if(r.tipo === 'master' && r.registros.helpgrid) r.aviso = ((r.aviso ? r.aviso + ' ' : '') + 'A Helpgrid vem em dois arquivos (duas contas BuyGoods). Se tiver o outro, volte e selecione os dois juntos — senão o mês fica só com uma conta.');
    impPending = r; renderImport_();
  });
}
function lerArquivo_(file){
  const reader = new FileReader();
  reader.onload = e => {
    let wb;
    try { wb = XLSX.read(e.target.result, {type:'binary', cellDates:false}); }
    catch(err){ console.error(err); renderImport_('Não consegui ler esse arquivo. Ele precisa ser .xls ou .xlsx.'); return; }
    const r = detectarEParsear_(wb, file.name);
    if(r.erro){ renderImport_(r.erro); return; }
    impPending = r; renderImport_();
  };
  reader.readAsBinaryString(file);
}
function detectarEParsear_(wb, nome){
  // Salesbound Financial Performance: aba Dashboard com cabeçalho "Mês | Gross Sales"
  for(const sn of wb.SheetNames){
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], {header:1, raw:true, defval:null});
    if(acharColuna_(rows, 'Mês', 'Gross Sales')) return parseSalesbound_(wb, nome);
  }
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:true, defval:null});
  if(rows.some(r => r && r[0] === 'Account' && r[1] === 'Affiliate')) return parseMaster_(rows, nome);
  if(rows.some(r => r && r[0] === 'Account' && r[1] === 'Visitors')) return parseMasterAccounts_(rows, nome);
  return {erro: 'Não reconheci esse arquivo. Ele precisa ser o Master Affiliates / Master Accounts (export da BuyGoods) ou o Salesbound Financial Performance.'};
}
// Master Accounts = conta BuyGoods interna da Help, por produto (sem coluna de afiliado/setor). Entra
// inteiro na Helpgrid, no setor "CRM interno". Pedidos não vêm no arquivo: saem de bruto ÷ AOV.
function parseMasterAccounts_(rows, nome){
  const hpos = rows.findIndex(r => r && r[0] === 'Account' && r[1] === 'Visitors');
  const hidx = {}; rows[hpos].forEach((h,i) => hidx[h] = i);
  const need = ['Gross Sales','Refunds','Chargebacks','Taxes','AOV','Net Sales'];
  if(!need.every(h => h in hidx)) return {erro: 'Esse Master Accounts está sem alguma coluna esperada (Gross Sales, Refunds, Chargebacks, Taxes, AOV, Net Sales).'};
  const titulo = rows[0] && rows[0][0] ? String(rows[0][0]) : '';
  const mes = parseMesInicioTitulo_(titulo);
  if(!mes) return {erro: `Não identifiquei o mês pelo título do arquivo ("${titulo}").`};
  const t = {orders:0, gross:0, net:0, refunds:0, taxes:0};
  for(let i=hpos+1; i<rows.length; i++){
    const row = rows[i]; if(!row || !row[0] || row[0] === 'Total') continue;
    const g = Number(row[hidx['Gross Sales']])||0, aov = Number(row[hidx['AOV']])||0;
    t.orders += aov ? Math.round(g / aov) : 0; t.gross += g; t.net += Number(row[hidx['Net Sales']])||0;
    t.refunds += (Number(row[hidx['Refunds']])||0) + (Number(row[hidx['Chargebacks']])||0); t.taxes += Number(row[hidx['Taxes']])||0;
  }
  Object.keys(t).forEach(f => t[f] = Math.round(t[f]*100)/100);
  return {tipo:'master', tipoLbl:'Master Accounts · CRM interno da Help', arquivo: nome, mes, interno: true,
    aviso: 'Master Accounts é a conta BuyGoods interna da Help: entra todo na Helpgrid, no setor "CRM interno da Help". Atenção: se a conta interna desse mês já entrou por um Master Affiliates (contas com "BG"/"PAG"), não importe este — ela seria contada duas vezes.',
    registros: {hgset_interno: {[mes]: t}}, linhas: []};
}
// o CRM interno soma no total da Helpgrid: junto com o Master Affiliates do mês, soma no que veio;
// sozinho, troca só a parte interna do total que já estava salvo
function aplicarInternoHelpgrid_(r){
  const mes = r.mes, novo = ((r.registros.hgset_interno || {})[mes]);
  if(!novo) return r;
  let base;
  if(r.registros.helpgrid && r.registros.helpgrid[mes]) base = r.registros.helpgrid[mes];
  else {
    const atual = (canalMensal.helpgrid || {})[mes] || {orders:0, gross:0, net:0, refunds:0, taxes:0};
    const velho = (canalMensal.hgset_interno || {})[mes] || {orders:0, gross:0, net:0, refunds:0, taxes:0};
    base = {}; ['orders','gross','net','refunds','taxes'].forEach(f => base[f] = (atual[f]||0) - (velho[f]||0));
  }
  const tot = {}; ['orders','gross','net','refunds','taxes'].forEach(f => tot[f] = Math.round(((base[f]||0) + (novo[f]||0))*100)/100);
  r.registros.helpgrid = {[mes]: tot};
  r.linhas = [{key:'helpgrid', mes, antes: ((canalMensal.helpgrid||{})[mes]||{}).gross ?? null, depois: tot.gross}];
  return r;
}
function parseMaster_(rows, nome){
  const hpos = rows.findIndex(r => r && r[0] === 'Account' && r[1] === 'Affiliate');
  const hidx = {}; rows[hpos].forEach((h,i) => hidx[h] = i);
  const need = ['Account','Affiliate','Orders (FE+BE)','Gross Sales','Net Sales','Total CBs & Refunds','Taxes'];
  if(!need.every(h => h in hidx)) return {erro: 'Esse Master Affiliates está sem alguma coluna esperada (Orders, Gross Sales, Net Sales, Refunds, Taxes).'};
  const titulo = rows[0] && rows[0][0] ? String(rows[0][0]) : '';
  const mes = parseMesInicioTitulo_(titulo);
  if(!mes) return {erro: `Não identifiquei o mês pelo título do arquivo ("${titulo}").`};
  const datas = titulo.match(/([A-Za-z]+)\s+\d{1,2},?\s+\d{4}/g) || [];
  const aviso = datas.length >= 2 && parseMesInicioTitulo_(datas[0]) !== parseMesInicioTitulo_(datas[1])
    ? `O arquivo cobre mais de um mês (${titulo.replace(/^Master Affiliates\s*/i,'')}). Tudo vai ser salvo em ${mesLblCurto_(mes)} — pra separar certo, exporte um mês por vez.` : '';
  const byCanal = {}; let welcomeCalls = 0, temInterno = false;
  for(let i=hpos+1; i<rows.length; i++){
    const row = rows[i]; if(!row) continue;
    const nomeAf = row[hidx['Affiliate']], account = row[hidx['Account']];
    if(!nomeAf || account === 'Total') continue;
    if(normName(nomeAf) === 'welcome calls'){ welcomeCalls += Number(row[hidx['Gross Sales']])||0; continue; }
    const key = canalDoNome_(normName(nomeAf)); if(!key) continue;
    // contas de produto com "BG"/"PAG" no fim são da conta BuyGoods interna da Help
    if(key === 'helpgrid' && /\s(BG|PAG)$/i.test(String(account || '').trim())) temInterno = true;
    const alvos = [key];
    if(key === 'helpgrid'){ const st = setorHelpgrid_(nomeAf); if(st) alvos.push('hgset_' + st); }
    alvos.forEach(k => {
      if(!byCanal[k]) byCanal[k] = {orders:0, gross:0, net:0, refunds:0, taxes:0};
      const r = byCanal[k];
      r.orders += Number(row[hidx['Orders (FE+BE)']])||0; r.gross += Number(row[hidx['Gross Sales']])||0;
      r.net += Number(row[hidx['Net Sales']])||0; r.refunds += Number(row[hidx['Total CBs & Refunds']])||0; r.taxes += Number(row[hidx['Taxes']])||0;
    });
  }
  const keys = Object.keys(byCanal);
  if(!keys.length) return {erro: 'O arquivo é um Master Affiliates, mas não tem nenhuma linha de parceiro (Helpgrid, Sales Bound, iSellForU, Gestor 5/3, NuYu).'};
  const registros = {};
  keys.forEach(k => { const r = byCanal[k]; registros[k] = {[mes]: {orders: r.orders, gross: Math.round(r.gross*100)/100, net: Math.round(r.net*100)/100, refunds: Math.round(r.refunds*100)/100, taxes: Math.round(r.taxes*100)/100}}; });
  const avisoWC = welcomeCalls > 0 ? `A conta "Welcome Calls" (NuYu + iSellForU) tem ${fmtMoney(welcomeCalls)} de bruto nesse arquivo e não entrou em nenhum dos dois — ainda falta definir como dividir.` : '';
  return {tipo:'master', tipoLbl:'Master Affiliates', arquivo: nome, aviso: [aviso, avisoWC].filter(Boolean).join(' '), registros, mes, temInterno,
    linhas: keys.filter(k => PMETA[k]).map(k => ({key: k, mes, antes: ((canalMensal[k]||{})[mes]||{}).gross ?? null, depois: registros[k][mes].gross}))};
}
// vários Master do mesmo mês (ex: as duas contas BuyGoods da Helpgrid) viram um import só, somado
function somarMasters_(lista){
  const mes = lista[0].mes;
  if(lista.some(x => x.mes !== mes)) return {erro: 'Os arquivos Master Affiliates são de meses diferentes — mande juntos só os do mesmo mês.'};
  const registros = {};
  lista.forEach(x => Object.keys(x.registros).forEach(k => {
    const v = x.registros[k][mes];
    if(!registros[k]) registros[k] = {[mes]: {orders:0, gross:0, net:0, refunds:0, taxes:0}};
    const a = registros[k][mes];
    ['orders','gross','net','refunds','taxes'].forEach(f => a[f] = Math.round(((a[f]||0) + (v[f]||0))*100)/100);
  }));
  const keys = Object.keys(registros).filter(k => PMETA[k]);
  if(lista.some(x => x.interno) && lista.some(x => x.temInterno)) return {erro: 'A conta interna da Help veio duas vezes: num Master Affiliates (contas com "BG"/"PAG") e no Master Accounts. Suba só um dos dois junto com o Master Affiliates geral.'};
  if(lista.some(x => x.interno)) return aplicarInternoHelpgrid_({tipo:'master', tipoLbl:`Master Affiliates + Accounts · ${lista.length} arquivos somados`, arquivo: lista.map(x => x.arquivo).join(' + '), mes,
    aviso: Array.from(new Set(lista.map(x => x.aviso).filter(Boolean))).join(' '), registros, linhas: []});
  return {tipo:'master', tipoLbl:`Master Affiliates · ${lista.length} arquivos somados`, arquivo: lista.map(x => x.arquivo).join(' + '), mes,
    aviso: Array.from(new Set(lista.map(x => x.aviso).filter(Boolean))).join(' '), registros,
    linhas: keys.map(k => ({key: k, mes, antes: ((canalMensal[k]||{})[mes]||{}).gross ?? null, depois: registros[k][mes].gross}))};
}
function parseSalesbound_(wb, nome){
  const dashName = wb.SheetNames.find(n => /dashboard/i.test(n)) || wb.SheetNames[0];
  const detName = wb.SheetNames.find(n => /detalhamento/i.test(n));
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[dashName], {header:1, raw:true, defval:null});
  const tituloBruto = rows.slice(0,3).map(r => (r||[]).map(c => c==null?'':String(c)).join(' ')).join(' ');
  const ano = (tituloBruto.match(/(\d{4})/) || [])[1] || String(new Date().getFullYear());
  const achado = acharColuna_(rows, 'Mês', 'Gross Sales');
  if(!achado) return {erro: 'Não achei o cabeçalho "Mês | Gross Sales" na aba Dashboard.'};
  const {linha: hpos, coluna: c0} = achado;
  const porMes = {};
  for(let i=hpos+1; i<rows.length; i++){
    const row = rows[i]; if(!row || !row[c0]) continue;
    const m = String(row[c0]).trim().match(/^([A-Za-z]{3})/); if(!m) break;
    const mesNum = MES_ABBR_[m[1].toLowerCase()]; if(!mesNum) break;
    const mk = `${ano}-${String(mesNum).padStart(2,'0')}`;
    porMes[mk] = {gross: Math.round((Number(row[c0+1])||0)*100)/100, refunds: Math.round(Math.abs(Number(row[c0+2])||0)*100)/100, net: Math.round((Number(row[c0+7])||0)*100)/100, taxes: 0, orders: 0};
  }
  if(detName && wb.Sheets[detName]){
    const det = XLSX.utils.sheet_to_json(wb.Sheets[detName], {header:1, raw:true, defval:null});
    const a = acharColuna_(det, 'Mês', 'Agente');
    if(a){ const dc0 = a.coluna; det.forEach(row => {
      if(!row || !row[dc0] || !row[dc0+1]) return;
      const m = String(row[dc0]).trim().match(/^([A-Za-z]{3})/); if(!m) return;
      const mesNum = MES_ABBR_[m[1].toLowerCase()]; if(!mesNum) return;
      const mk = `${ano}-${String(mesNum).padStart(2,'0')}`;
      if(porMes[mk]) porMes[mk].orders += Number(row[dc0+3])||0;
    }); }
  }
  const meses = Object.keys(porMes).sort();
  if(!meses.length) return {erro: 'Não encontrei nenhum mês na aba Dashboard.'};
  return {tipo:'financial_performance', tipoLbl:'Salesbound Financial Performance', arquivo: nome, aviso: '', registros: {welcome_salesbound: porMes},
    linhas: meses.map(mk => ({key:'welcome_salesbound', mes: mk, antes: ((canalMensal.welcome_salesbound||{})[mk]||{}).gross ?? null, depois: porMes[mk].gross}))};
}
async function confirmarImport_(){
  const p = impPending; if(!p) return;
  const batch = [];
  Object.keys(p.registros).forEach(key => {
    if(!canalMensal[key]) canalMensal[key] = {};
    Object.keys(p.registros[key]).forEach(mk => {
      canalMensal[key][mk] = p.registros[key][mk];
      batch.push(Object.assign({canal: key, mes: mk.replace('-','_')}, p.registros[key][mk]));
    });
  });
  saveLS(LS_CANAL_MENSAL, canalMensal);
  const parceiros = Object.keys(p.registros).filter(k => PMETA[k]);
  const mudou = p.linhas.filter(l => Math.round(l.depois - (l.antes||0)) !== 0);
  const resumo = (mudou.length ? mudou : p.linhas).map(l => `${PMETA[l.key].nome} ${mesLblCurto_(l.mes)}: ${fmtMoney(l.depois)}`).join(' · ') + (mudou.length ? '' : ' (sem mudança)');
  const reg = {id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), quando: new Date().toISOString(), arquivo: p.arquivo, tipo: p.tipo, tipoLbl: p.tipoLbl, parceiros: parceiros.join(','), resumo};
  importLog.unshift(reg); saveLS('tiger_import_log_v1', importLog);
  parceiros.forEach(k => { canalAtualizado[k] = reg.quando; });
  closeAll(); render();
  showToast(`Importado: ${parceiros.map(k => PMETA[k].nome).join(', ')}` + (APPS_SCRIPT_URL ? ' — sincronizando...' : ''));
  if(APPS_SCRIPT_URL){
    const [r1] = await Promise.all([apiPost('importCanalMensalBatch', batch), apiPost('logImport', {id: reg.id, arquivo: reg.arquivo, tipo: reg.tipoLbl, parceiros: reg.parceiros, resumo: reg.resumo})]);
    if(r1 && r1.ok){ syncStatus='ok'; showToast('Sincronizado com Google Sheets ✓'); }
    else { syncStatus='erro'; showToast('Salvo neste navegador, mas não sincronizou com o Sheets ainda'); }
    renderSyncBadge();
  }
}

// ---------- Busca rápida ----------
function openCmd(){ $('#cmdk').classList.add('on'); $('#scrim').classList.add('on'); $('#cmdq').value=''; renderCmd_(); setTimeout(() => $('#cmdq').focus(), 20); }
function renderCmd_(){
  const q = $('#cmdq').value.toLowerCase(), mk = mesRef_();
  const ps = PKEYS.filter(k => !q || PMETA[k].nome.toLowerCase().includes(q));
  const acts = [['Visão geral', () => go('overview')], ['Importar arquivo', openImport], ['Ver importações', () => go('imports')]].filter(a => !q || a[0].toLowerCase().includes(q));
  $('#cmdres').innerHTML = (ps.length ? '<div class="grp">Parceiros</div>' + ps.map((k,i) => { const v = valorMes_(k, mk); return `<div class="it ${i===0?'hl':''}" data-k="${k}">${plogo_(k)}${PMETA[k].nome}<span>${v ? fmtMoney(v.gross)+' em '+mesLblCurto_(mk) : 'sem dado'}</span></div>`; }).join('') : '')
    + (acts.length ? '<div class="grp">Ações</div>' + acts.map((a,i) => `<div class="it" data-a="${i}">${a[0]}<span></span></div>`).join('') : '');
  $('#cmdres').querySelectorAll('[data-k]').forEach(el => el.addEventListener('click', () => { closeAll(); go('partner', el.dataset.k); }));
  $('#cmdres').querySelectorAll('[data-a]').forEach(el => el.addEventListener('click', () => { closeAll(); acts[+el.dataset.a][1](); }));
}
$('#cmdq').addEventListener('input', renderCmd_);
$('#cmdq').addEventListener('keydown', e => { if(e.key === 'Enter'){ const f = document.querySelector('#cmdres .it'); if(f) f.click(); } });
document.addEventListener('keydown', e => {
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); openCmd(); }
  if(e.key === 'Escape') closeAll();
});
$('#scrim').addEventListener('click', closeAll);
$('#sideSearch').addEventListener('click', openCmd);
$('#topImport').addEventListener('click', openImport);
$('#nav-overview').addEventListener('click', () => go('overview'));
$('#nav-resumo').addEventListener('click', () => go('resumo'));
$('#nav-painel').addEventListener('click', () => go('painel'));
$('#nav-imports').addEventListener('click', () => go('imports'));
$('#nav-vendas').addEventListener('click', () => go('vendas'));
$('#nav-vendasgeral').addEventListener('click', () => go('vendasgeral'));

// ---------- Tema + sincronização ----------
function applyThemeUI_(){
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  $('#themeLbl').textContent = dark ? 'Modo claro' : 'Modo escuro';
}
$('#themeToggle').addEventListener('click', () => {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  if(dark) document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme','dark');
  try { localStorage.setItem('tiger_theme_v1', dark ? 'light' : 'dark'); } catch(e){}
  applyThemeUI_();
});
function renderSyncBadge(){
  const el = $('#syncBadge'); if(!el) return;
  const map = {desativado:['Sem sincronização','var(--text-3)'], pendente:['Sincronizando...','var(--amber)'], ok:['Sincronizado com Google Sheets','var(--green)'], erro:['Sem conexão — dados salvos neste navegador','var(--red)']};
  const [txt, cor] = map[syncStatus] || map.desativado;
  el.innerHTML = `<i style="background:${cor}"></i>${escapeHtml(txt)}`;
}
async function syncFromServer(){
  const j = await apiGet();
  if(!j || !j.ok){ renderSyncBadge(); return false; }
  canaisPorDia = serverCanaisToLocal(j.canaisInterno || {});
  canalLifetime = serverCanalLifetimeToLocal(j.canalLifetime || {});
  canalMensal = serverCanalMensalToLocal(j.canalMensal || {});
  canalAtualizado = {};
  const marca = (k, iso) => { if(k && iso && String(iso) > (canalAtualizado[k]||'')) canalAtualizado[k] = String(iso); };
  Object.values(j.canalMensal || {}).forEach(r => marca(r.canal, r.atualizado_em));
  Object.values(j.canaisInterno || {}).forEach(r => marca(r.canal, r.atualizado_em));
  const pdi = parceirosDiaDoServidor_(j.parceirosDia);
  if(pdPendente_()){
    // dados importados enquanto o backend não aceitava: mantém os daqui e sobe quando der
    if(j.parceirosDia !== undefined) setTimeout(reenviarParceirosDia_, 0);
  } else if(Object.keys(pdi.pd).length || pdi.dias.length){ parceirosDia = pdi.pd; diasRelatorio = pdi.dias; }
  if(j.parceirosDia !== undefined){ leadsDia = pdi.leads; saveLS('tiger_leads_dia_v1', leadsDia); if(pdi.funis){ funisNuyu = pdi.funis; saveLS('tiger_funil_nuyu_v1', funisNuyu); } if(pdi.lper){ leadsPeriodo = pdi.lper; saveLS('tiger_leads_periodo_v1', leadsPeriodo); } }
  Object.values(j.parceirosDia || {}).forEach(r => { if(!String(r.canal || '').startsWith('__')) marca(r.canal, r.atualizado_em); });
  saveLS('tiger_parceiros_dia_v1', parceirosDia); saveLS('tiger_dias_relatorio_v1', diasRelatorio);
  const dj_ = obj => { const out = {}; Object.keys(obj || {}).forEach(k => { try { out[k] = JSON.parse(obj[k].dados_json || '{}'); } catch(e){ out[k] = {}; } }); return out; };
  if(j.vendasPorProduto){ vendasPorProdutoDia = dj_(j.vendasPorProduto); saveLS('tiger_vendas_produto_v1', vendasPorProdutoDia); }
  if(j.vendasValorPorProduto){ vendasValorPorProdutoDia = dj_(j.vendasValorPorProduto); saveLS('tiger_vendas_valor_v1', vendasValorPorProdutoDia); }
  importLog = Object.values(j.importLog || {}).map(r => ({id: r.id, quando: r.quando, arquivo: r.arquivo, tipo: r.tipo, tipoLbl: r.tipo, parceiros: r.parceiros, resumo: r.resumo}))
    .sort((a,b) => String(b.quando).localeCompare(String(a.quando)));
  saveLS(LS_CANAIS, canaisPorDia); saveLS(LS_CANAL_LIFETIME, canalLifetime); saveLS(LS_CANAL_MENSAL, canalMensal); saveLS('tiger_import_log_v1', importLog);
  renderSyncBadge();
  return true;
}
applyThemeUI_();
renderSyncBadge();
render();
(async () => {
  if(!APPS_SCRIPT_URL) return;
  syncStatus = 'pendente'; renderSyncBadge();
  if(await syncFromServer()) render();
})();

</script>
