<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiger Parceiros</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --bg-sub:#FAFAF9; --bg-hover:#F4F4F3; --bg-active:#EFEFEE;
  --line:#EBEBEA; --line-strong:#DCDCDA;
  --text:#1B1B1A; --text-2:#5C5C58; --text-3:#8F8F8A;
  --accent:#F2682A; --accent-soft:#FEF0E9; --accent-text:#C24A12;
  --green:#1F7A3D; --green-bg:#E8F5EC; --amber:#8A5A00; --amber-bg:#FDF3DC;
  --red:#B42318; --red-bg:#FDECEA; --gray:#55595F; --gray-bg:#EFF0F1; --blue:#1D5FC4; --blue-bg:#E9F1FD;
  --bar-gross:#E4E4E1;
  --shadow:0 1px 2px rgba(20,20,18,.04), 0 8px 24px rgba(20,20,18,.08);
  --radius:10px;
}
:root[data-theme="dark"]{
  --bg:#141413; --bg-sub:#1A1A19; --bg-hover:#222220; --bg-active:#2A2A28;
  --line:#2A2A28; --line-strong:#383835;
  --text:#EDEDEA; --text-2:#A8A8A2; --text-3:#75756F;
  --accent-soft:#3A2116; --accent-text:#FF9B6B;
  --green:#6FD08F; --green-bg:#16301F; --amber:#F2C25B; --amber-bg:#352A12;
  --red:#FF8A80; --red-bg:#3A1A17; --gray:#B5B8BD; --gray-bg:#26282B; --blue:#8AB4FF; --blue-bg:#172641;
  --bar-gross:#34342F;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:13.5px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
button{font:inherit;color:inherit;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
svg{flex:none}
kbd{font:500 10.5px Inter;color:var(--text-3);border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--bg)}
.app{display:grid;grid-template-columns:240px 1fr;height:100vh}

.side{background:var(--bg-sub);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:10px 8px;overflow-y:auto}
.ws{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:8px;margin-bottom:10px}
.ws .logo{width:24px;height:24px;border-radius:6px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}
.ws b{font-weight:600}
.ws small{display:block;color:var(--text-3);font-size:11.5px;margin-top:-1px}
.side-search{display:flex;align-items:center;gap:8px;margin:0 2px 12px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text-3);cursor:pointer}
.side-search kbd{margin-left:auto}
.sec{font-size:11.5px;font-weight:500;color:var(--text-3);padding:12px 10px 4px}
.nav{display:flex;align-items:center;gap:9px;padding:5px 10px;border-radius:7px;color:var(--text-2);font-weight:500;border:0;background:none;width:100%;text-align:left}
.nav:hover{background:var(--bg-hover);color:var(--text)}
.nav.on{background:var(--bg-active);color:var(--text)}
.nav .ct{margin-left:auto;font-size:11.5px;color:var(--text-3);font-variant-numeric:tabular-nums}
.plogo{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;color:#fff;font-size:9.5px;font-weight:700;flex:none}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:8px}
.sync{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-3);padding:6px 10px}
.sync i{width:6px;height:6px;border-radius:50%;background:var(--green)}

.main{display:flex;flex-direction:column;min-width:0;height:100vh}
.top{display:flex;align-items:center;gap:10px;padding:0 24px;height:52px;border-bottom:1px solid var(--line);flex:none}
.crumb{display:flex;align-items:center;gap:6px;color:var(--text-3);font-weight:500}
.crumb b{color:var(--text);font-weight:600}
.crumb a{color:inherit;text-decoration:none;cursor:pointer}
.crumb a:hover{color:var(--text)}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:7px;border:1px solid var(--line-strong);background:var(--bg);font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--bg-hover)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.btn.pri:hover{filter:brightness(.96)}
.scroll{overflow:auto;flex:1}
.pad{padding:20px 24px 0}
.h1{font-size:20px;font-weight:650;letter-spacing:-.01em;margin:0 0 2px;display:flex;align-items:center;gap:10px}
.sub{color:var(--text-3);margin:0 0 16px}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi{border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px 10px;background:var(--bg)}
.kpi .l{font-size:12px;color:var(--text-3);font-weight:500}
.kpi .v{font-size:22px;font-weight:650;letter-spacing:-.02em;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;color:var(--text-3);display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:20px}
.kpi .d2{font-size:12px;color:var(--text-2);margin-top:2px}
.up{color:var(--green)} .down{color:var(--red)}

.views{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 24px;position:sticky;top:0;background:var(--bg);z-index:3}
.view{border:0;background:none;padding:9px 10px 10px;color:var(--text-2);font-weight:500;display:flex;gap:6px;align-items:center}
.view:hover{color:var(--text)}
.view.on{color:var(--text);box-shadow:inset 0 -2px 0 var(--text)}
.view .ct{font-size:11.5px;color:var(--text-3);background:var(--bg-hover);border-radius:5px;padding:0 5px}

.card{border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin:0 24px 16px;background:var(--bg)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.card-h b{font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-3)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--bg);padding:4px 10px;font-size:12px;font-weight:500;color:var(--text-2)}
.seg button.on{background:var(--bg-active);color:var(--text)}

table{width:100%;border-collapse:separate;border-spacing:0}
thead th{position:sticky;top:41px;background:var(--bg);z-index:2;text-align:left;font-weight:500;font-size:12px;color:var(--text-3);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th.r,td.r{text-align:right}
td{padding:0 12px;height:52px;border-bottom:1px solid var(--line);white-space:nowrap}
td:first-child,th:first-child{padding-left:24px}
td:last-child,th:last-child{padding-right:24px}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--bg-hover)}
.who{display:flex;align-items:center;gap:10px}
.who .plogo{width:26px;height:26px;border-radius:7px;font-size:11px}
.who b{font-weight:550;display:block}
.who small{color:var(--text-3);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:500}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.ok{background:var(--green-bg);color:var(--green)}
.warn{background:var(--amber-bg);color:var(--amber)}
.bad{background:var(--red-bg);color:var(--red)}
.neu{background:var(--gray-bg);color:var(--gray)}
.tag{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:12px;color:var(--text-2);background:var(--bg)}
.muted{color:var(--text-3)}
.money b{font-weight:550;display:block}
.money small{font-size:11.5px;display:block}
.share{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.share .bar{width:70px;height:6px;border-radius:3px;background:var(--bg-active);overflow:hidden}
.share .bar i{display:block;height:100%;background:var(--accent)}
tfoot td{font-weight:600;border-bottom:0;background:var(--bg-sub)}

.empty{padding:40px 24px;text-align:center;color:var(--text-3)}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}

.tl{position:relative;padding-left:22px;margin:4px 0}
.tl:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:1px;background:var(--line-strong)}
.ev{position:relative;margin-bottom:14px}
.ev:before{content:"";position:absolute;left:-19px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--bg);border:2px solid var(--accent)}
.ev .h{display:flex;gap:6px;align-items:center;font-size:12.5px;flex-wrap:wrap}
.ev .h b{font-weight:600}
.ev .h span{color:var(--text-3)}
.ev p{margin:5px 0 0;color:var(--text-2);background:var(--bg-sub);border:1px solid var(--line);border-radius:8px;padding:8px 10px}

.formula{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--text-2)}
.formula .t{border:1px solid var(--line);border-radius:6px;padding:2px 8px;background:var(--bg-sub)}
.formula .t b{color:var(--text);font-weight:600}

/* modal de import */
.scrim{position:fixed;inset:0;background:rgba(20,20,18,.24);opacity:0;pointer-events:none;transition:opacity .15s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.modal{position:fixed;left:50%;top:12vh;transform:translateX(-50%) translateY(-6px);width:520px;max-width:calc(100vw - 32px);background:var(--bg);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.15s;z-index:21}
.modal.on{opacity:1;pointer-events:auto;transform:translateX(-50%)}
.modal .mh{padding:16px 18px 6px;display:flex;align-items:center;gap:10px}
.modal .mh b{font-size:16px;font-weight:650}
.modal .mb{padding:6px 18px 18px}
.drop{border:1.5px dashed var(--line-strong);border-radius:12px;padding:26px;text-align:center;color:var(--text-3);margin:10px 0 12px}
.drop b{display:block;color:var(--text);font-weight:600;margin:6px 0 2px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer}
.opt:hover{background:var(--bg-hover)}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt small{display:block;color:var(--text-3)}
.preview{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:10px}
.preview table td{height:38px}
.preview table td:first-child{padding-left:12px}
.preview table td:last-child{padding-right:12px}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}

.cmdk{position:fixed;left:50%;top:14vh;transform:translateX(-50%);width:520px;max-width:calc(100vw - 32px);background:var(--bg);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.14s;z-index:30}
.cmdk.on{opacity:1;pointer-events:auto}
.cmdk input{width:100%;border:0;outline:0;background:none;color:var(--text);font:inherit;font-size:15px;padding:14px 16px;border-bottom:1px solid var(--line)}
.cmdk .grp{font-size:11.5px;color:var(--text-3);padding:10px 16px 4px;font-weight:500}
.cmdk .it{display:flex;gap:10px;align-items:center;padding:8px 10px;margin:0 6px;border-radius:8px;cursor:pointer}
.cmdk .it:hover,.cmdk .it.hl{background:var(--bg-hover)}
.cmdk .it span:last-child{margin-left:auto;color:var(--text-3);font-size:12px}
.cmdk .end{height:8px}
.tip{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:9px;font-size:12.5px;font-weight:500;box-shadow:var(--shadow);opacity:0;transition:.2s;pointer-events:none;z-index:40}
.tip.on{opacity:1}
.banner{margin:0 24px 14px;padding:10px 14px;border-radius:10px;background:var(--amber-bg);color:var(--amber);font-size:12.5px;display:flex;gap:8px;align-items:center}
.banner b{color:inherit}
@media (max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.kpis{grid-template-columns:repeat(2,1fr)}.kpis.k3{grid-template-columns:1fr}.hide-sm{display:none}}

.alert-err{margin:4px 0 12px;padding:10px 12px;border-radius:10px;background:var(--red-bg);color:var(--red);font-size:12.5px}
.alert-warn{margin:10px 0;padding:10px 12px;border-radius:10px;background:var(--amber-bg);color:var(--amber);font-size:12.5px}
.drop{display:block;cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.opt{cursor:default;display:block}
.opt:hover{background:transparent}
.muted-opt{opacity:.6}
.det{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.preview thead th{position:static;top:auto;padding:8px 12px}
.icon-x{width:30px;height:30px;display:grid;place-items:center;border:0;border-radius:7px;background:none;color:var(--text-3);cursor:pointer}
.icon-x:hover{background:var(--bg-hover);color:var(--text)}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:9px;font-size:12.5px;font-weight:500;box-shadow:var(--shadow);opacity:0;transition:.2s;pointer-events:none;z-index:40}
.toast.show{opacity:1}
.sync{cursor:default}

.vd-wrap{overflow-x:auto}
table.vd thead th{position:static}
table.vd th:first-child, table.vd td:first-child{position:sticky;left:0;background:var(--bg);z-index:1;min-width:150px}
table.vd td{height:auto;padding-top:8px;padding-bottom:8px}
.vd-c{white-space:nowrap;line-height:1.25}
.vd-n{display:block;font-weight:600;font-variant-numeric:tabular-nums}
.vd-g{display:block;font-size:12px;color:var(--text-2);font-variant-numeric:tabular-nums}
.vd-r{display:block;font-size:11.5px;color:var(--red);font-variant-numeric:tabular-nums}
.vd-tot{background:var(--bg-sub)}
.vd-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:18px 24px 0}
table.mini th{position:static;padding:7px 8px}
table.mini td{height:38px;padding:0 8px}
table.mini td:first-child, table.mini th:first-child{padding-left:0}
table.mini td:last-child, table.mini th:last-child{padding-right:0}
.views .view .plogo{width:16px;height:16px;font-size:8.5px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.mgrid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--text-3);font-weight:500}
.mgrid input,.mgrid select{height:34px;border:1px solid var(--line-strong);border-radius:8px;padding:0 10px;font:inherit;font-size:13px;background:var(--bg);color:var(--text)}
.mgrid input:focus,.mgrid select:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
@media (max-width:900px){.vd-grid{grid-template-columns:1fr}.mgrid{grid-template-columns:1fr}}
.custo-in{width:110px;height:30px;border:1px solid var(--line-strong);border-radius:7px;padding:0 8px;font:inherit;font-size:13px;text-align:right;background:var(--bg);color:var(--text)}
.custo-in:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.dre td{height:34px}
.dre td:first-child{color:var(--text-2)}
.dre tr.dre-sub td{font-weight:600;color:var(--text);border-top:1px solid var(--line-strong)}
.dre tr.dre-final td{font-weight:700;color:var(--text);background:var(--bg-sub);border-top:1px solid var(--line-strong)}
.dre tr.dre-final td.down, .dre tr.dre-sub td.down{color:var(--red)}
.setores td{height:auto;padding-top:10px;padding-bottom:10px;vertical-align:top}
.st-nome{font-weight:600}
.st-desc{font-size:12px;color:var(--text-3);white-space:normal;max-width:420px;line-height:1.35;margin-top:2px}
.st-bar{height:4px;border-radius:2px;background:var(--bg-active);margin-top:6px;max-width:240px;overflow:hidden}
.st-bar i{display:block;height:100%;background:#2E86AB}
table.vg tr.vg-tot td{font-weight:700;background:var(--bg-sub);border-top:1px solid var(--line-strong)}
</style>
<script>
  (function(){
    try {
      const saved = localStorage.getItem('tiger_theme_v1');
      const theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      if(theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    } catch(e){}
  })();
</script>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="ws"><div class="logo">T</div><div><b>Tiger Offers</b><small>Parceiros</small></div></div>
    <div class="side-search" id="sideSearch"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Buscar<kbd>Ctrl K</kbd></div>
    <button class="nav" id="nav-overview"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>Visão geral</button>
    <button class="nav" id="nav-vendas"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 6-6"/></svg>Vendas por dia</button>
    <button class="nav" id="nav-vendasgeral"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="12" width="4" height="9"/><rect x="10" y="7" width="4" height="14"/><rect x="17" y="3" width="4" height="18"/></svg>Vendas por dia geral</button>
    <button class="nav" id="nav-imports"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>Importações<span class="ct" id="ct-imp"></span></button>
    <div class="sec">Parceiros</div>
    <div id="navPartners"></div>
    <div class="side-foot">
      <button class="nav" id="themeToggle"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg><span id="themeLbl">Modo escuro</span></button>
      <div class="sync" id="syncBadge"></div>
    </div>
  </aside>
  <main class="main">
    <div class="top">
      <div class="crumb" id="crumb"></div>
      <div class="sp"></div>
      <button class="btn pri" id="topImport"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>Importar arquivo</button>
    </div>
    <div class="scroll" id="page"></div>
  </main>
</div>
<div class="scrim" id="scrim"></div>
<div class="modal" id="importModal"></div>
<div class="cmdk" id="cmdk"><input id="cmdq" placeholder="Buscar parceiro ou ação…"><div id="cmdres"></div><div class="end"></div></div>
<div class="toast" id="toast"></div>
<script>
const CANAL_DEFS = [
  {key:'helpgrid', label:'Helpgrid', match:n => n.includes('helpgrid'),
   nota:'Líquido aqui = nossa parte de verdade: 52% do Net Líquido (depois de COGS 10%, reembolso/chargeback, comissão e imposto). Os outros 48% ficam com a Helpgrid, não entram nesse número.'},
  {key:'welcome_salesbound', label:'Welcome · Sales Bound', match:n => n.replace(/\s+/g,'').includes('salesbound'),
   nota:'Líquido aqui = nossa parte de verdade: (Bruto − Reembolso − COGS 10%) × 55%. Os outros 45% ficam com a Sales Bound, não entram nesse número.'},

  let grupos = Array.from(new Set(Array.from(todosDias).filter(d => d <= hoje).map(grupoDe_))).sort().reverse();

  const cell = (s, g, col) => {

  }).join('');

  // KPIs: último dia com relatório, esta semana, este mês
  const mk = mesAtual_(), semana = isoWeekMonday_(hoje);
  const ultimoDia = Array.from(todosDias).filter(d => d <= hoje).sort().pop();
  const somaFiltro = f => canais.reduce((a,k) => { const fonte = diasFonte_(k); Object.keys(fonte).forEach(d => { if(f(d)){ a.v += fonte[d].vendas||0; a.g += fonte[d].gross||0; a.r += (fonte[d].refund||0) + (fonte[d].chargeback||0); } }); return a; }, {v:0,g:0,r:0});
  const kUlt = ultimoDia ? somaFiltro(d => d === ultimoDia) : {v:0,g:0,r:0};
  const kSem = somaFiltro(d => isoWeekMonday_(d) === semana), kMes = somaFiltro(d => d.slice(0,7) === mk);

  // ranking por conta e por produto no mês atual
  const porConta = {}, porProd = {};
  canais.forEach(k => Object.keys(parceirosDia[k] || {}).forEach(dia => {
    if(dia.slice(0,7) !== mk) return;
    const c = parceirosDia[k][dia].c || {};
    Object.keys(c).forEach(ct => {
      const id = k + '|' + ct; if(!porConta[id]) porConta[id] = {k, ct, v:0, g:0, r:0};
      porConta[id].v += c[ct].v||0; porConta[id].g += c[ct].g||0; porConta[id].r += (c[ct].r||0) + (c[ct].cb||0);
      Object.keys(c[ct].p || {}).forEach(pr => { if(!porProd[pr]) porProd[pr] = {v:0, g:0}; porProd[pr].v += c[ct].p[pr][0]||0; porProd[pr].g += c[ct].p[pr][1]||0; });
    });
  }));
  const contasArr = Object.values(porConta).sort((a,b) => b.g - a.g);
  const totG = contasArr.reduce((a,x) => a + x.g, 0) || 1;
  const prodArr = Object.keys(porProd).map(n => Object.assign({n}, porProd[n])).sort((a,b) => b.g - a.g).slice(0, 12);
  const totP = prodArr.reduce((a,x) => a + x.g, 0) || 1;

  // dias do mês sem relatório (até ontem)
  const faltando = [];
  for(let d = new Date(mk + '-01T12:00:00'); d.toISOString().slice(0,10) < hoje; d.setDate(d.getDate()+1)){
    const dk = d.toISOString().slice(0,10); if(!diasRelatorio.includes(dk)) faltando.push(dk);
  }

  const chips = [['', 'Todos']].concat(PKEYS.map(k => [k, PMETA[k].nome]));
  return `<div class="pad">
    <div style="display:flex;align-items:flex-start;gap:12px"><div style="flex:1;min-width:0">
      <h1 class="h1">Vendas por dia</h1>
      <p class="sub">Quantidade de vendas e faturamento de cada parceiro — e de cada conta dele — dia a dia. Alimente todo dia com o relatório BuyGoods.</p>
    </div>
    <button class="btn" data-act="manual">Lançar dia manual</button>
    <button class="btn" data-act="resumo">Copiar resumo da semana</button>
    <button class="btn pri" data-act="import">Importar relatórios</button></div>
    <div class="kpis k3">
      ${kpi('Último dia com relatório' + (ultimoDia ? ' · ' + diaLbl_(ultimoDia) : ''), kUlt, 'sem reembolso')}
      ${kpi('Esta semana · desde ' + diaLbl_(semana), kSem, 'sem reembolso')}
      ${kpi('Este mês · ' + mesLblCurto_(mk), kMes, 'sem reembolso')}
    </div>
    ${pdPendente_() ? `<div class="banner" style="margin:0 0 14px"><span><b>Salvo só neste navegador por enquanto.</b> O Sheets ainda não aceita esse dado novo; ele sobe sozinho assim que o backend for atualizado. Não limpe o navegador até lá.</span></div>` : ''}
    ${faltando.length ? `<div class="banner" style="margin:0 0 14px"><span><b>${faltando.length} ${faltando.length===1?'dia':'dias'} de ${mesLblCurto_(mk)} sem relatório BuyGoods:</b> ${faltando.map(diaLbl_).join(', ')}</span></div>` : ''}
  </div>
  <div class="views">${chips.map(([k,l]) => `<button class="view ${vdParceiro===k?'on':''}" data-vdp="${k}">${k ? plogo_(k) : ''}${l}</button>`).join('')}
    <span style="flex:1"></span>
    <div class="seg" style="align-self:center">${[['dia','Por dia'],['semana','Por semana'],['mes','Por mês']].map(([k,l]) => `<button class="${vdPeriodo===k?'on':''}" data-vdper="${k}">${l}</button>`).join('')}</div>
  </div>
  ${grupos.length ? `<div class="vd-wrap"><table class="vd">
    <thead><tr><th>${vdPeriodo==='dia'?'Dia':vdPeriodo==='semana'?'Semana':'Mês'}</th>${cols.map(c => `<th class="r" title="${escapeHtml(descConta_(c.key, c.conta || ''))}">${c.conta ? escapeHtml(c.lbl) : `<span style="display:inline-flex;gap:6px;align-items:center">${plogo_(c.key)}${escapeHtml(c.lbl)}</span>`}</th>`).join('')}<th class="r">Total</th></tr></thead>
    <tbody>${linhas}</tbody></table></div>
    <p class="muted" style="font-size:12px;margin:8px 24px 0">Em cada célula: vendas (pedido frontal), bruto e, quando houver, reembolso/chargeback do dia. "0" = teve relatório e não vendeu; "—" = sem dado.</p>`
  : `<div class="card" style="margin-top:16px"><div class="empty"><b>Nenhum relatório diário importado ainda</b>Selecione todos os relatórios BuyGoods do mês de uma vez — o painel separa por parceiro, conta e produto.<div style="margin-top:14px"><button class="btn pri" data-act="import">Importar relatórios</button></div></div></div>`}
  <div class="vd-grid">

      ${contasArr.length ? `<table class="mini"><thead><tr><th>Conta</th><th class="r">Vendas</th><th class="r">Bruto</th><th class="r">%</th></tr></thead><tbody>${contasArr.map(x => `<tr><td><div class="who">${plogo_(x.k)}<span>${escapeHtml(x.ct)}${descConta_(x.k, x.ct) ? `<small class="st-desc" style="display:block">${escapeHtml(descConta_(x.k, x.ct))}</small>` : ''}</span></div></td><td class="r num">${x.v}</td><td class="r num">${fmtMoney(x.g)}${x.r ? `<small class="down" style="display:block">−${fmtMoney(x.r)}</small>` : ''}</td><td class="r num">${(x.g/totG*100).toFixed(0)}%</td></tr>`).join('')}</tbody></table>` : '<p class="muted">Sem relatório importado neste mês.</p>'}
    </div>

}

// ---------- Vendas por dia geral: a operação inteira (todos os afiliados), por produto ----------
// Mesma visão do affiliates-tiger, lida do mesmo backend: contagem = pedido frontal; bruto/líquido
// somam tudo (upsell, downsell, frete). Alimentada pelo import BuyGoods feito no affiliates-tiger.
let vendasPorProdutoDia = loadLS('tiger_vendas_produto_v1', {});      // {produto: {dia: vendas}}
let vendasValorPorProdutoDia = loadLS('tiger_vendas_valor_v1', {});   // {produto: {dia: {gross, refund, chargeback, shipping, taxes}}}
let vgPeriodo = 'dia';
function vendasGeral_(){
  const VP = vendasPorProdutoDia, VV = vendasValorPorProdutoDia;
  const diasSet = new Set(); Object.values(VP).forEach(pd => Object.keys(pd).forEach(d => diasSet.add(d)));
  const allDays = Array.from(diasSet).sort();
  const somaV = obj => Object.values(obj || {}).reduce((s,v) => s + (v||0), 0);
  const produtos = Object.keys(VP).sort((a,b) => somaV(VP[b]) - somaV(VP[a]));
  const somaValor = (prods, f) => { const acc = {gross:0, refund:0, chargeback:0, shipping:0, taxes:0}; let tem = false;
    prods.forEach(p => Object.keys(VV[p] || {}).forEach(d => { if(!f(d)) return; tem = true; const v = VV[p][d];
      acc.gross += v.gross||0; acc.refund += v.refund||0; acc.chargeback += v.chargeback||0; acc.shipping += v.shipping||0; acc.taxes += v.taxes||0; }));
    return tem ? acc : null; };
  const nada = '<span class="muted">·</span>';

  // KPIs: ontem, esta semana, este mês
  const hoje = new Date().toISOString().slice(0,10), ontem = new Date(Date.now()-86400000).toISOString().slice(0,10);
  const mk = hoje.slice(0,7), semana = isoWeekMonday_(hoje);
  const cont = f => Object.values(VP).reduce((s,pd) => s + Object.keys(pd).reduce((a,d) => a + (f(d) ? pd[d]||0 : 0), 0), 0);
  const ultimo = allDays[allDays.length-1];
  const kpi = (lab, f, nota) => { const n = cont(f), v = somaValor(Object.keys(VV), f);
    return `<div class="kpi"><div class="l">${lab}</div><div class="v">${n} <span style="font-size:13px;font-weight:500;color:var(--text-3)">vendas</span></div>
      <div class="d2">${v ? `<b>${fmtMoney(v.gross)}</b> bruto · <b>${fmtMoney(netOf_(v))}</b> líquido` : 'sem dado de valor ainda'}</div><div class="d"><span>${nota}</span></div></div>`; };
  const semOntem = !cont(d => d === ontem) && ultimo && ultimo < ontem;

  // colunas por período
  let cols, lbls, val;
  if(vgPeriodo === 'semana'){
    cols = Array.from(new Set(allDays.map(isoWeekMonday_))).sort().slice(-10); lbls = cols.map(w => 'Sem ' + diaLbl_(w));
    val = (p, c) => Object.keys(VP[p]).reduce((s,d) => s + (isoWeekMonday_(d) === c ? VP[p][d]||0 : 0), 0);
  } else if(vgPeriodo === 'mes'){
    cols = Array.from(new Set(allDays.map(d => d.slice(0,7)))).sort().slice(-12); lbls = cols.map(mesLblCurto_);
    val = (p, c) => Object.keys(VP[p]).reduce((s,d) => s + (d.slice(0,7) === c ? VP[p][d]||0 : 0), 0);
  } else {
    cols = allDays.slice(-14); lbls = cols.map(diaLbl_);
    val = (p, c) => VP[p][c] || 0;
  }
  const todos = () => true;
  const linhas = produtos.map(p => { const v = somaValor([p], todos);
    return `<tr><td><b style="font-weight:550">${escapeHtml(p)}</b></td>${cols.map(c => { const n = val(p, c); return `<td class="r num">${n || nada}</td>`; }).join('')}
      <td class="r num" style="font-weight:650">${somaV(VP[p])}</td><td class="r num">${v ? fmtMoney(v.gross) : nada}</td><td class="r num">${v ? fmtMoney(netOf_(v)) : nada}</td></tr>`; }).join('');
  const vt = somaValor(produtos, todos);
  const total = `<tr class="vg-tot"><td>Total</td>${cols.map(c => `<td class="r num">${produtos.reduce((s,p) => s + val(p, c), 0)}</td>`).join('')}
    <td class="r num">${produtos.reduce((s,p) => s + somaV(VP[p]), 0)}</td><td class="r num">${vt ? fmtMoney(vt.gross) : '—'}</td><td class="r num">${vt ? fmtMoney(netOf_(vt)) : '—'}</td></tr>`;

  return `<div class="pad">
    <h1 class="h1">Vendas por dia geral</h1>
    <p class="sub">A operação inteira — soma de <b>todos os afiliados</b> por produto, dia a dia. Mesma visão do affiliates-tiger, alimentada pelo relatório BuyGoods importado lá. Conta só o <b>pedido frontal</b>; upsell, downsell e frete entram no bruto/líquido.${allDays.length ? ` Dados de ${diaLbl_(allDays[0])} a ${diaLbl_(ultimo)}.` : ''}</p>
    <div class="kpis k3">
      ${kpi('Ontem · ' + diaLbl_(ontem), d => d === ontem, semOntem ? 'sem import ainda — último dado: ' + diaLbl_(ultimo) : 'vendas (pedido frontal)')}
      ${kpi('Esta semana · desde ' + diaLbl_(semana), d => isoWeekMonday_(d) === semana, 'segunda até hoje')}
      ${kpi('Este mês · ' + mesLblCurto_(mk), d => d.slice(0,7) === mk, 'mês corrente')}
    </div>
  </div>
  <div class="views"><span style="flex:1"></span>
    <div class="seg" style="align-self:center">${[['dia','Por dia (últimos 14)'],['semana','Por semana'],['mes','Por mês']].map(([k,l]) => `<button class="${vgPeriodo===k?'on':''}" data-vgper="${k}">${l}</button>`).join('')}</div>
  </div>
  ${produtos.length ? `<div class="vd-wrap"><table class="vd vg">
    <thead><tr><th>Produto</th>${lbls.map(l => `<th class="r">${escapeHtml(l)}</th>`).join('')}<th class="r">Total</th><th class="r">Bruto</th><th class="r">Líquido</th></tr></thead>
    <tbody>${linhas}${total}</tbody></table></div>
    <p class="muted" style="font-size:12px;margin:8px 24px 0">Colunas de período = vendas (pedido frontal). Total, Bruto e Líquido = todo o histórico do produto. Líquido = bruto − reembolso − chargeback − frete − taxas.</p>`
  : `<div class="card" style="margin-top:16px"><div class="empty"><b>Sem dado ainda</b>Importe o relatório BuyGoods no affiliates-tiger — esta visão lê o mesmo dado.</div></div>`}
  <div style="height:40px"></div>`;
}

// ---------- Resumo da semana (pra mandar na segunda) ----------
function resumoSemana_(){
  const hoje = hojeKey_();
  // semana fechada anterior (segunda a domingo)
  const segAtual = isoWeekMonday_(hoje);
  const ini = new Date(segAtual + 'T12:00:00'); ini.setDate(ini.getDate() - 7);
  const iniK = ini.toISOString().slice(0,10);
  const fim = new Date(ini); fim.setDate(fim.getDate() + 6); const fimK = fim.toISOString().slice(0,10);
  const dentro = d => d >= iniK && d <= fimK;
  const RESP = {helpgrid:'call recovery', gestor5:'Sava', gestor3:'Nicollas', welcome_salesbound:'call center', welcome_isellforu:'welcome', nuyu:'welcome'};
  let tot = {v:0,g:0,r:0};
  const blocos = PKEYS.map(k => {
    const fonte = diasFonte_(k); const s = {v:0,g:0,r:0};
    Object.keys(fonte).forEach(d => { if(dentro(d)){ s.v += fonte[d].vendas||0; s.g += fonte[d].gross||0; s.r += (fonte[d].refund||0)+(fonte[d].chargeback||0); } });
    if(!s.v && !s.g && !s.r) return null;
    tot.v += s.v; tot.g += s.g; tot.r += s.r;
    const contas = contasDo_(k, dentro).map(ct => { const a = {v:0,g:0}; Object.keys(parceirosDia[k]||{}).forEach(d => { if(dentro(d)){ const t = totDia_(k, d, ct); a.v += t.v; a.g += t.g; } }); return {ct, ...a}; }).filter(x => x.v || x.g).sort((a,b) => b.g - a.g);
    return `• ${PMETA[k].nome} (${RESP[k]}): ${s.v ? s.v + ' vendas · ' : ''}${fmtMoney(s.g)} bruto${s.r ? ' · −' + fmtMoney(s.r) + ' reembolso/CB' : ''}` +
      (contas.length > 1 ? '\n' + contas.map(c => `   – ${c.ct}: ${c.v} vendas · ${fmtMoney(c.g)}`).join('\n') : '');
  }).filter(Boolean);
  const prods = {};
  PKEYS.forEach(k => Object.keys(parceirosDia[k]||{}).forEach(d => { if(!dentro(d)) return; const c = parceirosDia[k][d].c || {}; Object.values(c).forEach(x => Object.keys(x.p||{}).forEach(p => { prods[p] = (prods[p]||0) + (x.p[p][1]||0); })); }));
  const top = Object.keys(prods).sort((a,b) => prods[b]-prods[a]).slice(0,5).map(p => `${p} ${fmtMoney(prods[p])}`).join(' · ');
  const faltam = []; for(let d = new Date(iniK+'T12:00:00'); d <= fim; d.setDate(d.getDate()+1)){ const dk = d.toISOString().slice(0,10); if(!diasRelatorio.includes(dk)) faltam.push(diaLbl_(dk)); }
  return `Resumo semanal parceiros — ${diaLbl_(iniK)} a ${diaLbl_(fimK)}\n` +
    `Total: ${tot.v} vendas · ${fmtMoney(tot.g)} bruto${tot.r ? ' · −' + fmtMoney(tot.r) + ' reembolso/CB' : ''}\n\n` +
    (blocos.length ? blocos.join('\n') : 'Sem vendas registradas na semana.') +
    (top ? `\n\nProdutos que mais venderam: ${top}` : '') +
    (faltam.length ? `\n\nObs: sem relatório BuyGoods em ${faltam.join(', ')}.` : '');
}
function copiarResumo_(){
  const t = resumoSemana_();
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => showToast('Resumo da semana copiado ✓')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); showToast('Resumo da semana copiado ✓');
  });
}

async function salvarManual_(){
  const canal = $('#mnCanal').value, dia = $('#mnDia').value, conta = ($('#mnConta').value || 'CRM').trim();
  const v = Math.max(0, parseInt($('#mnV').value, 10) || 0), g = Math.max(0, parseFloat($('#mnG').value) || 0), r = Math.max(0, parseFloat($('#mnR').value) || 0);
  if(!/^\d{4}-\d{2}-\d{2}$/.test(dia)){ $('#mnErr').innerHTML = '<div class="alert-err">Escolha o dia.</div>'; return; }
  if(!parceirosDia[canal]) parceirosDia[canal] = {};
  // primeira vez que a Sales Bound entra no formato novo: traz junto os dias antigos lançados do CRM
  if(LEGADO_OK_.includes(canal) && !temNovo_(canal)){
    Object.keys(canaisPorDia[canal] || {}).forEach(d => { const x = canaisPorDia[canal][d]; parceirosDia[canal][d] = {c: {CRM: {v: x.vendas||0, i: x.vendas||0, g: x.gross||0, r: x.refund||0, cb: x.chargeback||0, p: {}}}}; });
  }
  if(!parceirosDia[canal][dia]) parceirosDia[canal][dia] = {c: {}};
  parceirosDia[canal][dia].c[conta] = {v, i: v, g: Math.round(g*100)/100, r: Math.round(r*100)/100, cb: 0, p: {}};

function ehRelatorioBuyGoods_(wb){
  return wb.SheetNames.some(sn => {
    const h = (XLSX.utils.sheet_to_json(wb.Sheets[sn], {header:1, raw:true, defval:null})[0]) || [];
    return h.includes('Affiliate Name') && h.includes('Action Type') && h.includes('Gross') && h.includes('Create Date');
  });
}
function parseRelatorioBuyGoods_(wb, nome){
  let diaArquivo = (nome.match(/(\d{4}-\d{2}-\d{2})/) || [])[1] || null;
  const linhas = [];
  const vistos = new Set();
  wb.SheetNames.forEach(sn => {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], {header:1, raw:true, defval:null});
    if(!rows.length) return;
    const hidx = {}; (rows[0] || []).forEach((h,i) => hidx[h] = i);
    if(!('Affiliate Name' in hidx) || !('Action Type' in hidx) || !('Gross' in hidx) || !('Create Date' in hidx)) return;
    for(let i=1; i<rows.length; i++){
      const row = rows[i]; if(!row) continue;
      const canc = row[hidx['Was Canceled']]; if(canc == 1 || canc === true) continue;
      const tipo = row[hidx['Action Type']];
      const idItem = 'Order Item Id' in hidx ? row[hidx['Order Item Id']] : null;
      if(idItem){ const kId = idItem + '|' + tipo; if(vistos.has(kId)) continue; vistos.add(kId); }
      linhas.push({row, hidx, sn, tipo});
    }
  });
  if(!diaArquivo){
    const cont = {};
    linhas.forEach(l => { if(l.tipo !== 'neworder') return; const dt = new Date(l.row[l.hidx['Create Date']]); if(!isNaN(dt)) { const k = dt.toISOString().slice(0,10); cont[k] = (cont[k]||0) + 1; } });
    diaArquivo = Object.keys(cont).sort((a,b) => cont[b]-cont[a])[0] || null;
  }
  if(!diaArquivo) return {erro: `Não consegui descobrir o dia do relatório "${nome}".`};
  const out = {};
  linhas.forEach(({row, hidx, sn, tipo}) => {
    const nomeAf = row[hidx['Affiliate Name']]; if(!nomeAf) return;
    const canal = canalDoNome_(normName(nomeAf)); if(!canal) return;
    const conta = String(nomeAf).trim().replace(/\s+/g, ' ');
    if(!out[canal]) out[canal] = {};
    if(!out[canal][conta]) out[canal][conta] = {v:0, i:0, g:0, r:0, cb:0, p:{}};
    const x = out[canal][conta];
    if(tipo === 'neworder'){
      const g = parseFloat(row[hidx['Gross']]) || 0;
      x.i++; x.g += g;
      const prod = sn;
      if(!x.p[prod]) x.p[prod] = [0, 0];
      x.p[prod][1] += g;
      if(isFrontal_(row, hidx)){ x.v++; x.p[prod][0]++; }
    } else if(tipo === 'refund'){
      x.r += parseFloat(row[hidx['Refund Amount']]) || 0;
    } else if(tipo === 'chargeback'){
      x.cb += parseFloat(row[hidx['Chargeback Amount']]) || 0;
    }
  });
  Object.values(out).forEach(cs => Object.values(cs).forEach(x => { x.g = Math.round(x.g*100)/100; x.r = Math.round(x.r*100)/100; x.cb = Math.round(x.cb*100)/100; Object.values(x.p).forEach(p => p[1] = Math.round(p[1]*100)/100); }));
  return {dia: diaArquivo, canais: out, arquivo: nome};
}
function isFrontal_(row, hidx){
  if(!('Product Codename' in hidx)) return true;
  const code = String(row[hidx['Product Codename']] || '').trim().toLowerCase();
  if(!code) return true;
  if(/^shi/.test(code)) return false;
  if(/up\d/.test(code)) return false;
  if(/dw\d/.test(code)) return false;
  return true;
}
function montarPendenteBuyGoods_(relatorios){
  const porDia = {};
  relatorios.sort((a,b) => a.arquivo.localeCompare(b.arquivo)).forEach(r => { porDia[r.dia] = r; }); // mesmo dia 2x: fica o último
  const dias = Object.keys(porDia).sort();

      linhas.push({k, dia, novo, antes});

  return {tipo: 'buygoods', tipoLbl: 'Relatório BuyGoods diário', arquivo: dias.length === 1 ? porDia[dias[0]].arquivo : `${relatorios.length} arquivos`, porDia, dias, linhasBG: linhas};
}
async function confirmarBuyGoods_(p){

function barChart_(series, keys, h){

function importsDe_(key){ return importLog.filter(i => (i.parceiros||'').split(',').includes(key)); }
function timelineImports_(lista){

function fmtQuando_(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('pt-BR', {day:'2-digit', month:'short'}) + ' · ' + d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
}

function custoCard_(key){
  const mk = mesAtual_();
  const meses = Array.from(new Set(mesesDo_(key).concat([mk]))).sort().slice(-3);
  const linhas = meses.map(m => dre_(key, (canalMensal[key]||{})[m] || {}));
  const fmtL = (val, tipo) => tipo === 'gross' ? fmtMoney(val) : val < 0 ? '−' + fmtMoney(Math.abs(val)) : fmtMoney(val);
  const corpo = linhas[0].map((row, r) => {
    const tipo = row[2] || '';
    const cls = tipo === 'final' ? 'dre-final' : tipo === 'sub' ? 'dre-sub' : '';
    return `<tr class="${cls}"><td>${row[0]}</td>${meses.map((m, c) => {
      const val = linhas[c][r][1];
      if(tipo === 'custo'){ const bf = (canalMensal[key]||{})[m] || {}; return `<td class="r"><input class="custo-in" type="number" min="0" step="0.01" data-custo-mes="${m}" value="${bf.custo ? bf.custo : ''}" placeholder="0,00"></td>`; }
      return `<td class="r num ${val < 0 && tipo !== 'final' && tipo !== 'sub' ? 'muted' : ''} ${(tipo === 'final' || tipo === 'sub') && val < 0 ? 'down' : ''}">${fmtL(val, tipo)}</td>`;
    }).join('')}</tr>`;
  }).join('');
  return `<div class="card"><div class="card-h"><b>Demonstrativo do mês</b><span class="muted" style="font-size:12px">${CUSTO_LABEL_[key]} é lançado à mão</span></div>
    <div style="overflow-x:auto"><table class="mini dre"><thead><tr><th></th>${meses.map(m => `<th class="r">${mesLblCurto_(m)}${m === mk ? ' <span class="muted" style="font-weight:400">(até agora)</span>' : ''}</th>`).join('')}</tr></thead><tbody>${corpo}</tbody></table></div>
    <div style="display:flex;justify-content:flex-end;margin-top:10px"><button class="btn pri" data-act="salvar-custo" data-canal="${key}">Salvar ${CUSTO_LABEL_[key]}</button></div></div>`;
}
async function salvarCustos_(key){
  const batch = [], mudou = [];
  document.querySelectorAll('[data-custo-mes]').forEach(inp => {
    const m = inp.dataset.custoMes, novo = Math.round((parseFloat(inp.value) || 0) * 100) / 100;
    if(!canalMensal[key]) canalMensal[key] = {};
    const atual = canalMensal[key][m] || {orders:0, gross:0, net:0, refunds:0, taxes:0};
    if((atual.custo || 0) === novo) return;
    canalMensal[key][m] = Object.assign({}, atual, {custo: novo});
    batch.push({canal: key, mes: m.replace('-','_'), custo: novo});
    mudou.push(`${mesLblCurto_(m)}: ${fmtMoney(novo)}`);
  });
  if(!batch.length){ showToast('Nenhum custo mudou'); return; }
  saveLS(LS_CANAL_MENSAL, canalMensal);
  render();
  showToast(CUSTO_LABEL_[key] + ' salvo' + (APPS_SCRIPT_URL ? ' — sincronizando...' : ''));
  if(!APPS_SCRIPT_URL) return;
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  const reg = {id, quando: new Date().toISOString(), arquivo: CUSTO_LABEL_[key], tipo: 'Custo do mês', tipoLbl: 'Custo do mês', parceiros: key, resumo: `${PMETA[key].nome} — ${CUSTO_LABEL_[key]} ${mudou.join(' · ')}`};
  importLog.unshift(reg); saveLS('tiger_import_log_v1', importLog);
  const [r1] = await Promise.all([apiPost('importCanalMensalBatch', batch), apiPost('logImport', {id, arquivo: reg.arquivo, tipo: reg.tipo, parceiros: key, resumo: reg.resumo})]);
  if(r1 && r1.ok){ syncStatus = 'ok'; showToast('Sincronizado com Google Sheets ✓'); }
  else { syncStatus = 'erro'; showToast('Salvo neste navegador, mas não sincronizou com o Sheets ainda'); }
  renderSyncBadge();
}

function lerArquivos_(files){
  impPending = null;
  renderImport_(null, `Lendo ${files.length} ${files.length===1?'arquivo':'arquivos'}…`);
  Promise.all(files.map(f => new Promise(res => {
    const reader = new FileReader();
    reader.onload = e => { try { res({f, wb: XLSX.read(e.target.result, {type:'binary', cellDates:false})}); } catch(err){ res({f, erro: true}); } };
    reader.readAsBinaryString(f);
  }))).then(lidos => {
    const ruins = lidos.filter(x => x.erro);
    if(ruins.length){ renderImport_(`Não consegui ler: ${ruins.map(x => x.f.name).join(', ')}. Precisa ser .xls ou .xlsx.`); return; }
    const bg = lidos.filter(x => ehRelatorioBuyGoods_(x.wb));
    if(bg.length && bg.length === lidos.length){
      const rel = bg.map(x => parseRelatorioBuyGoods_(x.wb, x.f.name));
      const erro = rel.find(r => r.erro); if(erro){ renderImport_(erro.erro); return; }
      impPending = montarPendenteBuyGoods_(rel); renderImport_(); return;
    }
    if(lidos.length > 1){
      const ms = lidos.map(x => detectarEParsear_(x.wb, x.f.name));
      if(ms.every(m => m.tipo === 'master')){ const r = somarMasters_(ms); if(r.erro){ renderImport_(r.erro); return; } impPending = r; renderImport_(); return; }
      renderImport_('Vários arquivos de uma vez funciona pra relatórios BuyGoods diários ou pra Master Affiliates do mesmo mês. O Financial Performance vai sozinho.'); return;
    }
    const r = detectarEParsear_(lidos[0].wb, lidos[0].f.name);
    if(r.erro){ renderImport_(r.erro); return; }
    if(r.tipo === 'master' && r.registros.helpgrid) r.aviso = ((r.aviso ? r.aviso + ' ' : '') + 'A Helpgrid vem em dois arquivos (duas contas BuyGoods). Se tiver o outro, volte e selecione os dois juntos — senão o mês fica só com uma conta.');
    impPending = r; renderImport_();
  });
}
function lerArquivo_(file){
  const reader = new FileReader();
  reader.onload = e => {
    let wb;
    try { wb = XLSX.read(e.target.result, {type:'binary', cellDates:false}); }
    catch(err){ console.error(err); renderImport_('Não consegui ler esse arquivo. Ele precisa ser .xls ou .xlsx.'); return; }
    const r = detectarEParsear_(wb, file.name);
    if(r.erro){ renderImport_(r.erro); return; }
    impPending = r; renderImport_();
  };
  reader.readAsBinaryString(file);
}
function detectarEParsear_(wb, nome){
  // Salesbound Financial Performance: aba Dashboard com cabeçalho "Mês | Gross Sales"
  for(const sn of wb.SheetNames){
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], {header:1, raw:true, defval:null});
    if(acharColuna_(rows, 'Mês', 'Gross Sales')) return parseSalesbound_(wb, nome);
  }
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:true, defval:null});
  if(rows.some(r => r && r[0] === 'Account' && r[1] === 'Affiliate')) return parseMaster_(rows, nome);
  return {erro: 'Não reconheci esse arquivo. Ele precisa ser o Master Affiliates (export da BuyGoods) ou o Salesbound Financial Performance.'};
}
function parseMaster_(rows, nome){
  const hpos = rows.findIndex(r => r && r[0] === 'Account' && r[1] === 'Affiliate');
  const hidx = {}; rows[hpos].forEach((h,i) => hidx[h] = i);
  const need = ['Account','Affiliate','Orders (FE+BE)','Gross Sales','Net Sales','Total CBs & Refunds','Taxes'];
  if(!need.every(h => h in hidx)) return {erro: 'Esse Master Affiliates está sem alguma coluna esperada (Orders, Gross Sales, Net Sales, Refunds, Taxes).'};
  const titulo = rows[0] && rows[0][0] ? String(rows[0][0]) : '';
  const mes = parseMesInicioTitulo_(titulo);
  if(!mes) return {erro: `Não identifiquei o mês pelo título do arquivo ("${titulo}").`};
  const datas = titulo.match(/([A-Za-z]+)\s+\d{1,2},?\s+\d{4}/g) || [];
  const aviso = datas.length >= 2 && parseMesInicioTitulo_(datas[0]) !== parseMesInicioTitulo_(datas[1])
    ? `O arquivo cobre mais de um mês (${titulo.replace(/^Master Affiliates\s*/i,'')}). Tudo vai ser salvo em ${mesLblCurto_(mes)} — pra separar certo, exporte um mês por vez.` : '';
  const byCanal = {}; let welcomeCalls = 0;
  for(let i=hpos+1; i<rows.length; i++){
    const row = rows[i]; if(!row) continue;
    const nomeAf = row[hidx['Affiliate']], account = row[hidx['Account']];
    if(!nomeAf || account === 'Total') continue;
    if(normName(nomeAf) === 'welcome calls'){ welcomeCalls += Number(row[hidx['Gross Sales']])||0; continue; }
    const key = canalDoNome_(normName(nomeAf)); if(!key) continue;
    const alvos = [key];
    if(key === 'helpgrid'){ const st = setorHelpgrid_(nomeAf); if(st) alvos.push('hgset_' + st); }
    alvos.forEach(k => {
      if(!byCanal[k]) byCanal[k] = {orders:0, gross:0, net:0, refunds:0, taxes:0};
      const r = byCanal[k];
      r.orders += Number(row[hidx['Orders (FE+BE)']])||0; r.gross += Number(row[hidx['Gross Sales']])||0;
      r.net += Number(row[hidx['Net Sales']])||0; r.refunds += Number(row[hidx['Total CBs & Refunds']])||0; r.taxes += Number(row[hidx['Taxes']])||0;
    });
  }
  const keys = Object.keys(byCanal);
  if(!keys.length) return {erro: 'O arquivo é um Master Affiliates, mas não tem nenhuma linha de parceiro (Helpgrid, Sales Bound, iSellForU, Gestor 5/3, NuYu).'};
  const registros = {};
  keys.forEach(k => { const r = byCanal[k]; registros[k] = {[mes]: {orders: r.orders, gross: Math.round(r.gross*100)/100, net: Math.round(r.net*100)/100, refunds: Math.round(r.refunds*100)/100, taxes: Math.round(r.taxes*100)/100}}; });
  const avisoWC = welcomeCalls > 0 ? `A conta "Welcome Calls" (NuYu + iSellForU) tem ${fmtMoney(welcomeCalls)} de bruto nesse arquivo e não entrou em nenhum dos dois — ainda falta definir como dividir.` : '';
  return {tipo:'master', tipoLbl:'Master Affiliates', arquivo: nome, aviso: [aviso, avisoWC].filter(Boolean).join(' '), registros, mes,
    linhas: keys.filter(k => PMETA[k]).map(k => ({key: k, mes, antes: ((canalMensal[k]||{})[mes]||{}).gross ?? null, depois: registros[k][mes].gross}))};
}
// vários Master do mesmo mês (ex: as duas contas BuyGoods da Helpgrid) viram um import só, somado
function somarMasters_(lista){
  const mes = lista[0].mes;
  if(lista.some(x => x.mes !== mes)) return {erro: 'Os arquivos Master Affiliates são de meses diferentes — mande juntos só os do mesmo mês.'};
  const registros = {};
  lista.forEach(x => Object.keys(x.registros).forEach(k => {
    const v = x.registros[k][mes];
    if(!registros[k]) registros[k] = {[mes]: {orders:0, gross:0, net:0, refunds:0, taxes:0}};
    const a = registros[k][mes];
    ['orders','gross','net','refunds','taxes'].forEach(f => a[f] = Math.round(((a[f]||0) + (v[f]||0))*100)/100);
  }));
  const keys = Object.keys(registros).filter(k => PMETA[k]);
  return {tipo:'master', tipoLbl:`Master Affiliates · ${lista.length} arquivos somados`, arquivo: lista.map(x => x.arquivo).join(' + '), mes,
    aviso: Array.from(new Set(lista.map(x => x.aviso).filter(Boolean))).join(' '), registros,
    linhas: keys.map(k => ({key: k, mes, antes: ((canalMensal[k]||{})[mes]||{}).gross ?? null, depois: registros[k][mes].gross}))};
}
function parseSalesbound_(wb, nome){
  const dashName = wb.SheetNames.find(n => /dashboard/i.test(n)) || wb.SheetNames[0];
  const detName = wb.SheetNames.find(n => /detalhamento/i.test(n));
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[dashName], {header:1, raw:true, defval:null});
  const tituloBruto = rows.slice(0,3).map(r => (r||[]).map(c => c==null?'':String(c)).join(' ')).join(' ');
  const ano = (tituloBruto.match(/(\d{4})/) || [])[1] || String(new Date().getFullYear());
  const achado = acharColuna_(rows, 'Mês', 'Gross Sales');
  if(!achado) return {erro: 'Não achei o cabeçalho "Mês | Gross Sales" na aba Dashboard.'};
  const {linha: hpos, coluna: c0} = achado;
  const porMes = {};
  for(let i=hpos+1; i<rows.length; i++){
    const row = rows[i]; if(!row || !row[c0]) continue;
    const m = String(row[c0]).trim().match(/^([A-Za-z]{3})/); if(!m) break;
    const mesNum = MES_ABBR_[m[1].toLowerCase()]; if(!mesNum) break;
    const mk = `${ano}-${String(mesNum).padStart(2,'0')}`;
    porMes[mk] = {gross: Math.round((Number(row[c0+1])||0)*100)/100, refunds: Math.round(Math.abs(Number(row[c0+2])||0)*100)/100, net: Math.round((Number(row[c0+7])||0)*100)/100, taxes: 0, orders: 0};
  }
  if(detName && wb.Sheets[detName]){
    const det = XLSX.utils.sheet_to_json(wb.Sheets[detName], {header:1, raw:true, defval:null});
    const a = acharColuna_(det, 'Mês', 'Agente');
    if(a){ const dc0 = a.coluna; det.forEach(row => {
      if(!row || !row[dc0] || !row[dc0+1]) return;
      const m = String(row[dc0]).trim().match(/^([A-Za-z]{3})/); if(!m) return;
      const mesNum = MES_ABBR_[m[1].toLowerCase()]; if(!mesNum) return;
      const mk = `${ano}-${String(mesNum).padStart(2,'0')}`;
      if(porMes[mk]) porMes[mk].orders += Number(row[dc0+3])||0;
    }); }
  }
  const meses = Object.keys(porMes).sort();
  if(!meses.length) return {erro: 'Não encontrei nenhum mês na aba Dashboard.'};
  return {tipo:'financial_performance', tipoLbl:'Salesbound Financial Performance', arquivo: nome, aviso: '', registros: {welcome_salesbound: porMes},
    linhas: meses.map(mk => ({key:'welcome_salesbound', mes: mk, antes: ((canalMensal.welcome_salesbound||{})[mk]||{}).gross ?? null, depois: porMes[mk].gross}))};
}
async function confirmarImport_(){
  const p = impPending; if(!p) return;
  const batch = [];
  Object.keys(p.registros).forEach(key => {
    if(!canalMensal[key]) canalMensal[key] = {};
    Object.keys(p.registros[key]).forEach(mk => {
      canalMensal[key][mk] = p.registros[key][mk];
      batch.push(Object.assign({canal: key, mes: mk.replace('-','_')}, p.registros[key][mk]));
    });
  });
  saveLS(LS_CANAL_MENSAL, canalMensal);
  const parceiros = Object.keys(p.registros).filter(k => PMETA[k]);
  const mudou = p.linhas.filter(l => Math.round(l.depois - (l.antes||0)) !== 0);
  const resumo = (mudou.length ? mudou : p.linhas).map(l => `${PMETA[l.key].nome} ${mesLblCurto_(l.mes)}: ${fmtMoney(l.depois)}`).join(' · ') + (mudou.length ? '' : ' (sem mudança)');
  const reg = {id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), quando: new Date().toISOString(), arquivo: p.arquivo, tipo: p.tipo, tipoLbl: p.tipoLbl, parceiros: parceiros.join(','), resumo};
  importLog.unshift(reg); saveLS('tiger_import_log_v1', importLog);
  parceiros.forEach(k => { canalAtualizado[k] = reg.quando; });
  closeAll(); render();
  showToast(`Importado: ${parceiros.map(k => PMETA[k].nome).join(', ')}` + (APPS_SCRIPT_URL ? ' — sincronizando...' : ''));
  if(APPS_SCRIPT_URL){
    const [r1] = await Promise.all([apiPost('importCanalMensalBatch', batch), apiPost('logImport', {id: reg.id, arquivo: reg.arquivo, tipo: reg.tipoLbl, parceiros: reg.parceiros, resumo: reg.resumo})]);
    if(r1 && r1.ok){ syncStatus='ok'; showToast('Sincronizado com Google Sheets ✓'); }
    else { syncStatus='erro'; showToast('Salvo neste navegador, mas não sincronizou com o Sheets ainda'); }
    renderSyncBadge();
  }
}
